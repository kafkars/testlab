schema_version = 2
id = "apache-kafka-4.2.1-single-plaintext"
title = "Apache Kafka 4.2.1 single-broker plaintext"

[driver]
kind = "docker_compose"
image = "apache/kafka@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0"
cluster_size = 1
compose_files = ["clusters/apache-kafka/compose/single-plaintext.yml", "clusters/apache-kafka/compose/single-share.yml"]
broker_services = ["broker"]
client_port = 9092

[driver.broker]
implementation = "apache-kafka"
version = "4.2.1"

[driver.security]
transport = "plaintext"
authentication = "none"
