x-sasl-environment: &sasl-environment
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
  KAFKA_DELEGATION_TOKEN_SECRET_KEY: kafkars-testlab-delegation-secret
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:${KAFKA_EXTERNAL_PROTOCOL:-PLAINTEXT},OBSERVER:SASL_PLAINTEXT
  KAFKA_LISTENERS: CONTROLLER://:29093,EXTERNAL://:9092,INTERNAL://:19092,OBSERVER://:39092
  KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
  KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafkars" password="kafkars-testlab-password" user_kafkars="kafkars-testlab-password";
  KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
  KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
  KAFKA_LISTENER_NAME_OBSERVER_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_LISTENER_NAME_OBSERVER_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafkars" password="kafkars-testlab-password" user_kafkars="kafkars-testlab-password";

services:
  broker-1:
    environment:
      <<: *sasl-environment
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT_1},INTERNAL://broker-1:19092,OBSERVER://broker-1:39092
  broker-2:
    environment:
      <<: *sasl-environment
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT_2},INTERNAL://broker-2:19092,OBSERVER://broker-2:39092
  broker-3:
    environment:
      <<: *sasl-environment
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT_3},INTERNAL://broker-3:19092,OBSERVER://broker-3:39092
