schema = 1

[[contract]]
id = "HARNESS-001"
title = "The run is valid before it supports a claim"
statement = "A process, protocol, environment, timeout, broker, or harness failure produces invalid evidence rather than a client pass or fail."
category = "validity"

[[contract]]
id = "CAP-001"
title = "The adapter declares every required capability"
statement = "A scenario starts only when the adapter handshake contains every capability required by the scenario."
category = "capability"

[[contract]]
id = "CLIENT-001"
title = "Public client commands complete successfully"
statement = "A normalized public client API failure produces valid failing evidence rather than invalid harness evidence."
category = "client"

[[contract]]
id = "ADMIN-001"
title = "Admin topic creation settles exactly once"
statement = "Each requested public topic creation emits exactly one completion naming the exact operation and topic."
category = "admin"

[[contract]]
id = "ADMIN-002"
title = "Admin partition creation settles exactly once"
statement = "Each requested public partition-count increase emits exactly one completion naming the exact operation and topic."
category = "admin"

[[contract]]
id = "TXN-001"
title = "Transaction disposition settles exactly once"
statement = "Each requested transaction emits one exact public commit or abort completion."
category = "transaction"

[[contract]]
id = "TXN-002"
title = "Read-committed visibility matches transaction outcome"
statement = "Committed records are independently visible exactly once and aborted records remain absent."
category = "transaction"

[[contract]]
id = "TXN-003"
title = "Replacement ownership fences an active transaction"
statement = "A replacement transactional producer makes the old commit report fenced and the old staged records remain absent from read-committed observation."
category = "transaction"

[[contract]]
id = "PROTO-001"
title = "Adapter messages are correlated and versioned"
statement = "Every adapter event uses the current protocol version and exact command identity that caused it."
category = "protocol"

[[contract]]
id = "PROTO-002"
title = "External observations belong to declared operations"
statement = "The environment never reports a record for an operation absent from the scenario."
category = "protocol"

[[contract]]
id = "PROD-001"
title = "Producer admission matches the scenario"
statement = "Each send emits exactly one accepted or rejected decision matching the scenario."
category = "producer"

[[contract]]
id = "PROD-002"
title = "Every accepted send settles exactly once"
statement = "Each accepted producer operation reaches one and only one terminal outcome."
category = "producer"

[[contract]]
id = "PROD-003"
title = "Acknowledgment is broker-visible exactly once"
statement = "An acknowledged operation has exactly one matching independent observation."
category = "producer"

[[contract]]
id = "PROD-004"
title = "Definitely-not-sent operations are absent"
statement = "A definitely-not-sent operation has no matching broker observation."
category = "producer"

[[contract]]
id = "PROD-005"
title = "Possibly-sent never permits duplicates"
statement = "A possibly-sent operation has at most one matching broker observation."
category = "producer"

[[contract]]
id = "PROD-006"
title = "Broker-visible records preserve exact bytes"
statement = "Every observation and its recorded digest match the canonical scenario record digest."
category = "producer"

[[contract]]
id = "PROD-007"
title = "Terminal certainty matches the scenario"
statement = "The normalized terminal status equals the scenario expectation."
category = "producer"

[[contract]]
id = "PROD-008"
title = "Broker visibility matches the scenario"
statement = "The observation count satisfies the scenario visibility expectation."
category = "producer"

[[contract]]
id = "CONS-001"
title = "Consumer receive settles exactly once"
statement = "Each requested bounded receive emits exactly one matching completion."
category = "consumer"

[[contract]]
id = "CONS-002"
title = "Consumer returns the exact produced record"
statement = "A consumer receive exposes the expected produced topic, partition, key, value, and ordered headers exactly once."
category = "consumer"

[[contract]]
id = "CONS-003"
title = "Group receive commits its exact checkpoint"
statement = "A successful group receive commits the assignment-fenced checkpoint derived from its exact public batch."
category = "consumer"

[[contract]]
id = "CONS-004"
title = "Group receive proves the requested membership protocol"
statement = "A group receive exposes a positive public classic generation or KIP-848 member epoch matching the scenario's requested protocol."
category = "consumer"

[[contract]]
id = "LIFE-001"
title = "Client creation settles exactly once"
statement = "Each requested client creation emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-002"
title = "Producer creation settles exactly once"
statement = "Each requested producer creation emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-003"
title = "Producer flush settles exactly once"
statement = "Each requested producer flush emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-004"
title = "Producer close settles exactly once"
statement = "Each requested producer close emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-005"
title = "Client shutdown settles exactly once"
statement = "Each requested client shutdown emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-006"
title = "Adapter finish settles exactly once"
statement = "A complete scenario emits exactly one finished event before process exit."
category = "lifecycle"

[[contract]]
id = "LIFE-007"
title = "Client readiness settles exactly once"
statement = "Each requested public client readiness probe emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-008"
title = "Assigned consumer creation settles exactly once"
statement = "Each requested assigned-consumer creation emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-009"
title = "Direct assignment settles exactly once"
statement = "Each requested direct assignment emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-010"
title = "Assigned consumer close settles exactly once"
statement = "Each requested assigned-consumer close emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-011"
title = "Group consumer creation settles exactly once"
statement = "Each requested classic group-consumer registration emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-012"
title = "Group consumer close settles exactly once"
statement = "Each requested classic group-consumer close emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-013"
title = "Transactional producer creation settles exactly once"
statement = "Each requested transactional producer initialization emits exactly one matching event."
category = "lifecycle"

[[contract]]
id = "LIFE-014"
title = "Transactional producer close settles exactly once"
statement = "Each requested transactional producer close emits exactly one matching event."
category = "lifecycle"
