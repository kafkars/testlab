name: RC2 targeted regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    if: github.head_ref == 'feat/rc2-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell:
          - apache-kafka-3-7-2-plaintext
          - apache-kafka-4-3-1-three-tls
          - apache-kafka-4-3-1-three-sasl-plain
          - apache-kafka-4-3-1-three-scram-sha-256
          - apache-kafka-4-3-1-three-scram-sha-512
    steps:
      - name: Check out Testlab
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: testlab
          persist-credentials: false
      - name: Check out exact compatibility candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: kafkars/kafkars
          ref: 1aa09bbdb85a86a04d1b2a7ce258ed315895d309
          path: kafkars-candidate
          persist-credentials: false
      - uses: ./testlab/.github/actions/setup-rust
      - run: rustup toolchain install 1.90.0 --profile minimal
      - name: Select diagnostic scenarios without altering release coverage
        working-directory: testlab
        env:
          CELL: ${{ matrix.cell }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          cell_id = os.environ['CELL']
          release = tomllib.loads(Path('qualifications/kafkars-release.toml').read_text())
          cell, = [cell for cell in release['cells'] if cell['id'] == cell_id]
          classic = [
              'transactional-offset-classic', 'classic-group-shutdown',
              'classic-group-membership-ownership', 'admin-describe-consumer-group',
              'admin-delete-consumer-group',
          ]
          security = [
              'consumer-protocol-group-shutdown',
              'consumer-protocol-group-membership-ownership',
              'classic-group-session-recovery', 'consumer-protocol-group-session-recovery',
              'admin-list-consumer-groups-multiple', 'admin-describe-classic-groups',
              'admin-consumer-group-offsets-batch-lifecycle',
              'transactional-offset-classic', 'transactional-offset-consumer',
          ]
          scenarios = classic if cell_id == 'apache-kafka-3-7-2-plaintext' else security
          paths = [f'scenarios/kafka/{name}.toml' for name in scenarios]
          original_pack = tomllib.loads(Path(cell['pack']).read_text())
          assert set(paths) <= set(original_pack['scenarios'])
          output = Path('target/rc2-regressions')
          output.mkdir(parents=True, exist_ok=True)
          pack_path = output / 'pack.toml'
          pack_path.write_text(
              'schema_version = 1\nid = "rc2-diagnostic"\n'
              'title = "RC2 diagnostic regressions, not release qualification"\n'
              f'scenarios = {json.dumps(paths)}\n'
          )
          (output / 'qualification.toml').write_text(
              'schema_version = 2\nid = "rc2-diagnostic"\n'
              'title = "RC2 diagnostic regressions, not release qualification"\n'
              f'[[cells]]\nid = {json.dumps(cell_id)}\n'
              f'environment = {json.dumps(cell["environment"])}\n'
              f'pack = {json.dumps(str(pack_path))}\nattempts = 1\ngating = true\n'
          )
          PY
      - name: Package and run targeted real-broker regressions
        working-directory: testlab
        run: |
          cargo build --locked -p testctl
          target/debug/testctl qualify-kafkars \
            --root . --kafkars-root ../kafkars-candidate \
            --qualification target/rc2-regressions/qualification.toml \
            --evidence-dir ../rc2-regression-evidence
      - name: Archive diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc2-regressions-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rc2-regression-evidence
            testlab/target/rc2-regressions
          if-no-files-found: error
          retention-days: 30
