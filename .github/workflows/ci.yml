name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: 0.0.2
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - uses: ./.github/actions/setup-rust
      - name: Install the zrail toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install pinned zrail
        run: cargo +1.96.0 install zrail --version 0.0.1 --locked
      - name: Check architecture
        run: zcheck run architecture --format github

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: 0.0.2
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - uses: ./.github/actions/setup-rust
      - run: zcheck run rust-lint --format github
      - name: Retain complete lint diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-lint-diagnostics
          path: ~/.cache/zcheck
          if-no-files-found: error

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: 0.0.2
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - uses: ./.github/actions/setup-rust
      - run: zcheck run rust-test --format github

  repository-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: 0.0.2
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - uses: ./.github/actions/setup-rust
      - run: zcheck run repository-selftest --format github
      - name: Upload sealed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-evidence
          path: target/reference-evidence
          if-no-files-found: error

  quality-gate:
    if: ${{ always() }}
    needs: [architecture, rust-lint, rust-test, repository-selftest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every evidence lane
        env:
          ARCHITECTURE: ${{ needs.architecture.result }}
          LINT: ${{ needs.rust-lint.result }}
          TEST: ${{ needs.rust-test.result }}
          SELFTEST: ${{ needs.repository-selftest.result }}
        run: |
          test "$ARCHITECTURE" = success
          test "$LINT" = success
          test "$TEST" = success
          test "$SELFTEST" = success
