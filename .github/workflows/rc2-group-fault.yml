name: RC2 hosted group regression checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  group-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        environment: [three-sasl-plain, three-tls]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: testlab
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: kafkars/kafkars
          ref: c93e2094de4d70d3af9e8f7cc8bd99d5f7904fee
          path: kafkars-candidate
          persist-credentials: false
      - name: Select unchanged scenarios against the clean candidate
        env:
          TARGET_CELL: ${{ matrix.environment }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          environment = os.environ["TARGET_CELL"]
          assert environment in ("three-sasl-plain", "three-tls")
          Path("testlab/packs/rc2-group-fault.toml").write_text('''schema_version = 1
          id = "rc2-group-fault"
          title = "RC2 focused group checks, not release evidence"
          scenarios = ["scenarios/kafka/consumer-protocol-group-membership-ownership.toml", "scenarios/kafka/classic-group-session-recovery.toml", "scenarios/kafka/consumer-protocol-group-session-recovery.toml"]
          ''')
          Path("testlab/qualifications/kafkars-pr.toml").write_text(f'''schema_version = 2
          id = "rc2-group-fault"
          title = "RC2 focused group checks, not release evidence"
          [[cells]]
          id = "apache-kafka-4-3-1-{environment}"
          environment = "clusters/apache-kafka/4.3.1/{environment}.toml"
          pack = "packs/rc2-group-fault.toml"
          attempts = 3
          gating = true
          ''')
          PY
          git -C testlab diff > focused-harness.patch
      - uses: ./testlab
        with:
          kafkars-path: kafkars-candidate
          evidence-directory: rc2-group-check-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: rc2-group-check-${{ matrix.environment }}
          path: |
            rc2-group-check-evidence
            focused-harness.patch
          if-no-files-found: error
