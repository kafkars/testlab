name: RC2 hosted group recovery diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  group-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: testlab
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: kafkars/kafkars
          ref: d4f7eaf1a68e62bd4623bd3644f7c8a285924321
          path: kafkars-candidate
          persist-credentials: false
      - name: Instrument only disposable copies and retain unchanged scenarios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("kafkars-candidate/crates/kafka-client-engine/src/consumer")
          def patch(relative, before, after):
              source = base / relative
              code = source.read_text()
              assert code.count(before) == 1, relative
              source.write_text(code.replace(before, after))
          patch("group/registry_graceful_revocation.rs",
                ".map_err(GroupConsumerRevocationPortError::Acknowledge)",
                '''.map_err(|error| {
                      static CALLS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
                      if CALLS.fetch_add(1, std::sync::atomic::Ordering::Relaxed) % 100 == 0 {
                          eprintln!("RC2_GROUP_ACK group={group_id:?} public={assignment_epoch} error={error:?}");
                      }
                      GroupConsumerRevocationPortError::Acknowledge(error)
                  })''')
          patch("group/registry_graceful_revocation.rs",
                "return Err(GroupConsumerRevocationPortError::GroupUnavailable);",
                '''static UNAVAILABLE: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
                  if UNAVAILABLE.fetch_add(1, std::sync::atomic::Ordering::Relaxed) % 100 == 0 {
                      eprintln!("RC2_GROUP_UNAVAILABLE group={group_id:?} public={assignment_epoch} active={} fault={}", entry.state == GroupConsumerEntryState::Active, entry.fault.is_some());
                  }
                  return Err(GroupConsumerRevocationPortError::GroupUnavailable);''')
          patch("group/classic_group_fetch/delivery.rs",
                ") -> Result<Option<ClassicGroupFetchDelivery>, ClassicGroupFetchDeliveryError> {",
                ''') -> Result<Option<ClassicGroupFetchDelivery>, ClassicGroupFetchDeliveryError> {
                  static POLLS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
                  if POLLS.fetch_add(1, std::sync::atomic::Ordering::Relaxed) % 100 == 0 {
                      eprintln!("RC2_GROUP_FETCH machine={:?} effects={} pending={} sessions={}", self.machine, self.effects.len(), self.pending_fetches.len(), self.fetches.retained_broker_sessions());
                  }''')
          patch("fetch_execution/broker_session_begin.rs",
                "self.entries[index].in_flight = true;\n        Ok(BrokerSessionPlan {",
                '''static PLANS: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);
                  if PLANS.fetch_add(1, std::sync::atomic::Ordering::Relaxed) % 100 == 0 {
                      eprintln!("RC2_GROUP_SESSION broker={broker_id:?} session={:?} active={active:?} forgotten={forgotten:?}", self.entries[index].metadata);
                  }
                  self.entries[index].in_flight = true;
                  Ok(BrokerSessionPlan {''')
          reader = Path("testlab/crates/testctl/src/process_io.rs")
          code = reader.read_text()
          for before, after in [
              ("const MAX_STDERR_BYTES: usize = 64 * 1024;", "const MAX_STDERR_BYTES: usize = 2 * 1024 * 1024;"),
              ("const MAX_STDERR_READ: u64 = 64 * 1024 + 1;", "const MAX_STDERR_READ: u64 = 2 * 1024 * 1024 + 1;"),
              ("    let _ = sender.send(value);", '    eprintln!("{value}");\n    let _ = sender.send(value);'),
          ]:
              assert code.count(before) == 1
              code = code.replace(before, after)
          reader.write_text(code)
          Path("testlab/packs/rc2-group-fault.toml").write_text('''schema_version = 1
          id = "rc2-group-fault"
          title = "RC2 group diagnostics, not release evidence"
          scenarios = ["scenarios/kafka/consumer-protocol-group-membership-ownership.toml", "scenarios/kafka/classic-group-session-recovery.toml"]
          ''')
          Path("testlab/qualifications/kafkars-pr.toml").write_text('''schema_version = 2
          id = "rc2-group-fault"
          title = "RC2 group diagnostics, not release evidence"
          [[cells]]
          id = "apache-kafka-4-3-1-three-sasl-plain"
          environment = "clusters/apache-kafka/4.3.1/three-sasl-plain.toml"
          pack = "packs/rc2-group-fault.toml"
          attempts = 3
          gating = true
          ''')
          PY
          git -C kafkars-candidate diff > instrumented-candidate.patch
          git -C testlab diff > instrumented-harness.patch
      - uses: ./testlab
        with:
          kafkars-path: kafkars-candidate
          allow-dirty: "true"
          evidence-directory: rc2-group-fault-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: rc2-group-fault-evidence
          path: |
            rc2-group-fault-evidence
            instrumented-candidate.patch
            instrumented-harness.patch
          if-no-files-found: error
