name: RC2 lock review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'feat/rc2-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 install zrail --version 0.0.1 --locked
      - name: Report grants without accepting them
        run: zrail diff --base origin/main > zrail-review.txt
      - name: Verify the exact qualification inputs approved by the user
        run: |
          sha256sum --check <<'APPROVED_INPUTS'
          8850ceb256942d3712a64dea467ed1421784ea297ea56f7bfe32c8dfc4389846  action.yml
          7a211907f4a159aeed7eb4dd335b9be1df4ea2d81b644afdc54f588c051e635a  qualifications/kafkars-pr.toml
          2feb6ad6a5fe7f66bd4c82ebec8b73f6bdf072ec3602f683392a266be3fe730b  scripts/qualify-kafkars-candidate
          dfd88d8b57225ad6d74b811151daf19a49ff105a0757e76e72afebe8a6e3e95f  .github/workflows/qualification-release.yml
          3bd3b2efd21b8f32eb7a0dda574eb1aad9ca616fb97e390166e5777dbbc3ae7d  zrail.toml
          APPROVED_INPUTS
          grep -Fx 'Changes: 0 grants, 1 revokes, 0 debt, 0 cleanup, 0 neutral, 1 unknown' zrail-review.txt
      - name: Refresh the reviewed lock once with explicit user approval
        run: zrail update --base origin/main --accept-grants > zrail-update.txt
      - name: Upload architecture review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-zrail-review
          path: |
            zrail-review.txt
            zrail-update.txt
            zrail.lock
          if-no-files-found: error
