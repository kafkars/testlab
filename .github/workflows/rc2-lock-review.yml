name: RC2 lock review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'feat/rc2-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 install zrail --version 0.0.1 --locked
      - name: Report grants without accepting them
        run: zrail diff --base origin/main > zrail-review.txt
      - name: Upload architecture review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-zrail-review
          path: zrail-review.txt
          if-no-files-found: error
