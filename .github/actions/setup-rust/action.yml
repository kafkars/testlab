name: setup pinned Rust
description: install the repository toolchain, components, and native build dependencies
runs:
  using: composite
  steps:
    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libcurl4-openssl-dev
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
        rustup default 1.88.0
