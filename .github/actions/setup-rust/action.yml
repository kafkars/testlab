name: setup pinned Rust
description: install the repository toolchain, components, and native build dependencies
runs:
  using: composite
  steps:
    - name: Install native build dependencies
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../../scripts/install-native-build-dependencies"
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
        rustup default 1.88.0
