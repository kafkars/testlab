schema_version = 37
id = "adversary.metadata-stall"
title = "metadata response stall respects the public deadline"
description = "The external Kafka peer delays a valid Metadata response beyond the public request bound; the packaged client must return the declared timeout while the environment records the exact bounded stall."
timeout_ms = 15000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "arm-metadata-stall"
kind = "arm_protocol_fault"
operation_id = "adversary-metadata-stall"
api = "metadata"
applications = 1

[steps.fault]
kind = "stall"
duration_ms = 3000

[[steps]]
id = "describe-topic"
kind = "describe_topic"
client_id = "client-1"
operation_id = "describe-after-stall"
topic = "testlab-adversary-topic"
expected_error_code = "timeout"
timeout_ms = 1000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
