schema_version = 37
id = "adversary.metadata-disconnect-after-request"
title = "metadata disconnect after request preserves request ownership"
description = "The external Kafka peer reads the complete Metadata request and disconnects before constructing a response; the public client must report the declared transport failure."
timeout_ms = 15000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "arm-disconnect"
kind = "arm_protocol_fault"
operation_id = "adversary-metadata-disconnect-after-request"
api = "metadata"
applications = 1

[steps.fault]
kind = "disconnect"
point = "after_request"

[[steps]]
id = "describe-topic"
kind = "describe_topic"
client_id = "client-1"
operation_id = "describe-after-disconnect"
topic = "testlab-adversary-topic"
expected_error_code = "transport"
timeout_ms = 3000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
