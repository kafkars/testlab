schema_version = 37
id = "adversary.metadata-stale-response"
title = "metadata stale response is not accepted as current"
description = "After bootstrap negotiation, the external Kafka peer replays the prior complete response for a Metadata request; the packaged client must reject the stale correlation and body."
timeout_ms = 15000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "arm-stale-response"
kind = "arm_protocol_fault"
operation_id = "adversary-metadata-stale"
api = "metadata"
applications = 1

[steps.fault]
kind = "stale_response"

[[steps]]
id = "describe-topic"
kind = "describe_topic"
client_id = "client-1"
operation_id = "describe-after-stale"
topic = "testlab-adversary-topic"
expected_error_code = "transport"
timeout_ms = 3000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
