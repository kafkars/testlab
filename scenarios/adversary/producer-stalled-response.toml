schema_version = 37
id = "adversary.producer-stalled-response"
title = "producer response stall preserves possibly-sent certainty"
description = "The external Kafka peer receives a Produce request but delays its response beyond the packaged producer delivery bound; the public terminal must preserve possibly-sent uncertainty without a broker-visibility claim."
timeout_ms = 45000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "arm-produce-stall"
kind = "arm_protocol_fault"
operation_id = "adversary-produce-stall"
api = "produce"
applications = 1

[steps.fault]
kind = "stall"
duration_ms = 25000

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "produce-after-stall"

[steps.record]
topic = "testlab-adversary-topic"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "stalled-key" }
value = { encoding = "utf8", data = "stalled-value" }

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "produce-after-stall"
accepted = true
terminal = "possibly_sent"
visibility = "zero_or_one"
