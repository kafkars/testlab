schema_version = 37
id = "adversary.metadata-disconnect-after-response"
title = "complete metadata response survives a following disconnect"
description = "The external Kafka peer writes one complete valid Metadata response before disconnecting; the packaged public result must retain that exact successful response."
timeout_ms = 15000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "arm-disconnect"
kind = "arm_protocol_fault"
operation_id = "adversary-metadata-disconnect-after-response"
api = "metadata"
applications = 1

[steps.fault]
kind = "disconnect"
point = "after_response"

[[steps]]
id = "describe-topic"
kind = "describe_topic"
client_id = "client-1"
operation_id = "describe-before-disconnect"
topic = "testlab-adversary-topic"
expected_partitions = [0]
timeout_ms = 3000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
