schema_version = 37
id = "kafka.admin-topic-lifecycle"
title = "packaged admin composes a complete independently observed topic lifecycle"
description = "The packaged admin creates one partition, expands the same topic first to two and then four partitions, describes and lists the final topology, and deletes the topic; every public transition is followed by an exact independent metadata observation."
timeout_ms = 180000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-create"
topic = "testlab-kafkars-admin-topic-lifecycle"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "expand-topic-to-two"
kind = "create_partitions"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-expand-two"
topic = "testlab-kafkars-admin-topic-lifecycle"
total_count = 2
validate_only = false
timeout_ms = 20000

[[steps]]
id = "expand-topic-to-four"
kind = "create_partitions"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-expand-four"
topic = "testlab-kafkars-admin-topic-lifecycle"
total_count = 4
validate_only = false
timeout_ms = 20000

[[steps]]
id = "describe-expanded-topic"
kind = "describe_topic"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-describe"
topic = "testlab-kafkars-admin-topic-lifecycle"
expected_partitions = [0, 1, 2, 3]
timeout_ms = 20000

[[steps]]
id = "list-expanded-topic"
kind = "list_topics"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-list"
include_internal = false
required_topics = ["testlab-kafkars-admin-topic-lifecycle"]
timeout_ms = 20000

[[steps]]
id = "delete-expanded-topic"
kind = "delete_topic"
client_id = "client-1"
operation_id = "admin-topic-lifecycle-delete"
topic = "testlab-kafkars-admin-topic-lifecycle"
timeout_ms = 30000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
