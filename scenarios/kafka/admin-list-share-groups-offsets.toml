schema_version = 56
id = "kafka.admin-list-share-groups-offsets"
title = "packaged admin lists two independently observed Share-group offsets"
description = "Two closed Share groups retain distinct accepted-prefix offsets while one caller-ordered public batch preserves every group and partition result; separate read-only Kafka CLI offset queries confirm both start offsets and lags."
timeout_ms = 300000
requires = ["producer", "share_consumer", "share_consumer_configuration", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-client-2"
kind = "create_client"
client_id = "client-2"

[[steps]]
id = "await-client-2-ready"
kind = "await_client_ready"
client_id = "client-2"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-alpha-accepted"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offsets-alpha-accepted"
record = { topic = "testlab-kafkars-admin-share-offsets-alpha", partition = 0, sequence = 1, value = { encoding = "utf8", data = "accepted" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offsets-alpha-accepted" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "send-alpha-pending"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offsets-alpha-pending"
record = { topic = "testlab-kafkars-admin-share-offsets-alpha", partition = 0, sequence = 2, value = { encoding = "utf8", data = "pending" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offsets-alpha-pending" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }] }

[[steps]]
id = "send-zulu-accepted"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offsets-zulu-accepted"
record = { topic = "testlab-kafkars-admin-share-offsets-zulu", partition = 0, sequence = 3, value = { encoding = "utf8", data = "accepted" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offsets-zulu-accepted" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } }] }

[[steps]]
id = "send-zulu-pending"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offsets-zulu-pending"
record = { topic = "testlab-kafkars-admin-share-offsets-zulu", partition = 0, sequence = 4, value = { encoding = "utf8", data = "pending" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offsets-zulu-pending" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "4" } }] }

[[steps]]
id = "flush-markers"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "create-alpha-share-consumer"
kind = "create_share_consumer"
client_id = "client-1"
consumer_id = "share-alpha"
group_id = "testlab-admin-share-offsets-alpha"
topic = "testlab-kafkars-admin-share-offsets-alpha"
membership_timeout_ms = 30000
close_timeout_ms = 30000
configuration = { max_records = 1, batch_size = 1 }

[[steps]]
id = "receive-alpha-accepted"
kind = "share_receive"
consumer_id = "share-alpha"
receive_id = "receive-share-offsets-alpha"
expected_operation_ids = ["op-share-offsets-alpha-accepted"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-alpha-accepted"
kind = "share_acknowledge"
consumer_id = "share-alpha"
receive_id = "receive-share-offsets-alpha"
acknowledgement_id = "ack-share-offsets-alpha"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "close-alpha-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-alpha"
expect_success = true

[[steps]]
id = "create-zulu-share-consumer"
kind = "create_share_consumer"
client_id = "client-2"
consumer_id = "share-zulu"
group_id = "testlab-admin-share-offsets-zulu"
topic = "testlab-kafkars-admin-share-offsets-zulu"
membership_timeout_ms = 30000
close_timeout_ms = 30000
configuration = { max_records = 1, batch_size = 1 }

[[steps]]
id = "receive-zulu-accepted"
kind = "share_receive"
consumer_id = "share-zulu"
receive_id = "receive-share-offsets-zulu"
expected_operation_ids = ["op-share-offsets-zulu-accepted"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-zulu-accepted"
kind = "share_acknowledge"
consumer_id = "share-zulu"
receive_id = "receive-share-offsets-zulu"
acknowledgement_id = "ack-share-offsets-zulu"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "close-zulu-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-zulu"
expect_success = true

[[steps]]
id = "list-share-groups-offsets"
kind = "list_share_groups_offsets"
client_id = "client-1"
operation_id = "admin-list-share-groups-offsets"
groups = [
  { group_id = "testlab-admin-share-offsets-zulu", partitions = [{ topic = "testlab-kafkars-admin-share-offsets-zulu", partition = 0, expected_start_offset = 1, expected_lag = 1 }] },
  { group_id = "testlab-admin-share-offsets-alpha", partitions = [{ topic = "testlab-kafkars-admin-share-offsets-alpha", partition = 0, expected_start_offset = 1, expected_lag = 1 }] },
]
timeout_ms = 20000

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[steps]]
id = "shutdown-client-2"
kind = "shutdown_client"
client_id = "client-2"

[[assertions]]
operation_id = "op-share-offsets-alpha-accepted"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-share-offsets-alpha-pending"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-share-offsets-zulu-accepted"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-share-offsets-zulu-pending"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
