schema_version = 168
id = "kafka.producer-batch-network-connection-cut-recovery"
title = "packaged producer batch reconnects after an external connection cut"
description = "The external proxy proves a live Kafka connection was cut after baseline delivery, then the same packaged producer issues one exact public batch whose complete record set is acknowledged through re-established connections."
timeout_ms = 90000
requires = ["producer", "producer_batch", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-baseline"
kind = "send"
producer_id = "producer-1"
operation_id = "network-batch-baseline"

[steps.record]
topic = "testlab-kafkars-network-batch"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "baseline" }
value = { encoding = "utf8", data = "before-cut" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "network-batch-baseline" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "cut-live-connections"
kind = "cut_network_connections"
operation_id = "network-batch-cut-live-connections"
broker_ordinal = 1
timeout_ms = 5000

[[steps]]
id = "send-batch-after-cut"
kind = "send_batch"
producer_id = "producer-1"

[[steps.operations]]
operation_id = "network-batch-recovered-1"

[steps.operations.record]
topic = "testlab-kafkars-network-batch"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "recovered-1" }
value = { encoding = "utf8", data = "after-cut-1" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "network-batch-recovered-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps.operations]]
operation_id = "network-batch-recovered-2"

[steps.operations.record]
topic = "testlab-kafkars-network-batch"
partition = 0
sequence = 3
key = { encoding = "utf8", data = "recovered-2" }
value = { encoding = "utf8", data = "after-cut-2" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "network-batch-recovered-2" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "network-batch-baseline"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "network-batch-recovered-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "network-batch-recovered-2"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
