schema_version = 6
id = "kafka.assigned-consumer-round-trip"
title = "packaged assigned consumer reads exact produced bytes"
description = "The packaged client produces one record, directly assigns a consumer from the beginning, and returns the exact topic, partition, key, value, and ordered headers."
timeout_ms = 90000
requires = ["producer", "assigned_consumer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-produced"

[steps.record]
topic = "testlab-kafkars-assigned-consumer"
partition = 0
sequence = 1
key = { encoding = "hex", data = "00636f6e73756d6572ff" }
value = { encoding = "hex", data = "00726f756e642d74726970ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-produced" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
  { name = "binary", value = { encoding = "hex", data = "00ff" } },
  { name = "nullable" },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assigned-consumer"
partition = 0

[[steps]]
id = "receive-record"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-1"
expected_operation_id = "op-produced"
timeout_ms = 20000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-produced"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
