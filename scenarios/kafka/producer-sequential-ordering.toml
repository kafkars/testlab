schema_version = 37
id = "kafka.producer-sequential-ordering"
title = "sequential producer sends preserve same-partition order"
description = "Four separately completed public sends to one partition appear at strictly increasing independent broker offsets with matching public metadata."
timeout_ms = 90000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-1"
kind = "send"
producer_id = "producer-1"
operation_id = "op-order-1"
record = { topic = "testlab-kafkars-sequential-order", partition = 0, sequence = 1, key = { encoding = "utf8", data = "same-key" }, value = { encoding = "utf8", data = "first" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-order-1" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "send-2"
kind = "send"
producer_id = "producer-1"
operation_id = "op-order-2"
record = { topic = "testlab-kafkars-sequential-order", partition = 0, sequence = 2, key = { encoding = "utf8", data = "same-key" }, value = { encoding = "utf8", data = "second" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-order-2" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }] }

[[steps]]
id = "send-3"
kind = "send"
producer_id = "producer-1"
operation_id = "op-order-3"
record = { topic = "testlab-kafkars-sequential-order", partition = 0, sequence = 3, key = { encoding = "utf8", data = "same-key" }, value = { encoding = "utf8", data = "third" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-order-3" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } }] }

[[steps]]
id = "send-4"
kind = "send"
producer_id = "producer-1"
operation_id = "op-order-4"
record = { topic = "testlab-kafkars-sequential-order", partition = 0, sequence = 4, key = { encoding = "utf8", data = "same-key" }, value = { encoding = "utf8", data = "fourth" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-order-4" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "4" } }] }

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-order-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-order-2"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-order-3"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-order-4"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
