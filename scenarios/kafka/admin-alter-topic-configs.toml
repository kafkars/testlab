schema_version = 149
id = "kafka.admin-alter-topic-configs"
title = "packaged admin alters caller-ordered topic configurations"
description = "Named caller-ordered plural descriptions prove every prior value while the topic-convenience incremental surface sets, deletes, appends, and subtracts through exact public methods and independent reads confirm every transition."
timeout_ms = 240000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-topic-configs-before"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs-before"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_value = "delete" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_value = "delete" },
]
timeout_ms = 20000

[[steps]]
id = "alter-topic-configs"
kind = "alter_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs"
baseline_operation_id = "admin-alter-topic-configs-before"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_previous_value = "delete", value = "compact" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_previous_value = "delete", value = "compact" },
]
timeout_ms = 20000

[[steps]]
id = "describe-set-topic-configs"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs-set"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_value = "compact" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_value = "compact" },
]
timeout_ms = 20000

[[steps]]
id = "delete-topic-configs"
kind = "alter_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs-delete"
baseline_operation_id = "admin-alter-topic-configs-set"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_previous_value = "compact", value = "delete", method = "delete" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_previous_value = "compact", value = "delete", method = "delete" },
]
timeout_ms = 20000

[[steps]]
id = "describe-deleted-topic-configs"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs-deleted"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_value = "delete" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_value = "delete" },
]
timeout_ms = 20000

[[steps]]
id = "append-topic-configs"
kind = "alter_topic_configs"
client_id = "client-1"
operation_id = "admin-alter-topic-configs-append"
baseline_operation_id = "admin-alter-topic-configs-deleted"
topics = [
  { topic = "testlab-kafkars-admin-alter-topic-configs-zulu", config_name = "cleanup.policy", expected_previous_value = "delete", value = "delete,compact", method = "append", operation_value = "compact" },
  { topic = "testlab-kafkars-admin-alter-topic-configs-alpha", config_name = "cleanup.policy", expected_previous_value = "delete", value = "delete,compact", method = "append", operation_value = "compact" },
]
timeout_ms = 20000

[[steps]]
id = "describe-appended-topic-configs"
