schema_version = 162
id = "kafka.admin-create-topic-manual-replica-placement"
title = "packaged admin creates a topic with exact replica placement"
description = "The packaged public admin creates a three-partition topic from caller-ordered replica assignments, and immediate independent metadata requires each exact replica order, a replica leader, and the full replica set in sync."
timeout_ms = 90000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-manually-placed-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-manually-placed-topic"
topic = "testlab-kafkars-admin-manual-placement"
partitions = 3
replication_factor = 2
validate_only = false
timeout_ms = 30000

[[steps.replica_assignments]]
partition_index = 0
broker_ids = [2, 1]

[[steps.replica_assignments]]
partition_index = 1
broker_ids = [3, 2]

[[steps.replica_assignments]]
partition_index = 2
broker_ids = [1, 3]

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
