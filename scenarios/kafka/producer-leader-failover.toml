schema_version = 37
id = "kafka.producer-leader-failover"
title = "producer recovers across an observed partition leader election"
description = "Testlab independently selects and stops the exact leader for the record partition, proves a distinct replacement, and the live packaged producer acknowledges independently visible work while the original owner remains offline."
timeout_ms = 180000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-before-failover"
kind = "send"
producer_id = "producer-1"
operation_id = "op-before-failover"
[steps.record]
topic = "testlab-kafkars-leader-failover"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "before-leader-failover" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-before-failover" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }]

[[steps]]
id = "stop-partition-leader"
kind = "stop_broker_role"
timeout_ms = 45000
[steps.target]
role = "partition_leader"
topic = "testlab-kafkars-leader-failover"
partition = 0

[[steps]]
id = "send-after-failover"
kind = "send"
producer_id = "producer-1"
operation_id = "op-after-failover"
[steps.record]
topic = "testlab-kafkars-leader-failover"
partition = 0
sequence = 2
value = { encoding = "utf8", data = "after-leader-failover" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-after-failover" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }]

[[steps]]
id = "restore-partition-leader"
kind = "restore_broker_role"
timeout_ms = 45000
[steps.target]
role = "partition_leader"
topic = "testlab-kafkars-leader-failover"
partition = 0

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-before-failover"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-after-failover"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
