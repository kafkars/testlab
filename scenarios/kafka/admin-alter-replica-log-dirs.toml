schema_version = 87
id = "kafka.admin-alter-replica-log-dirs"
title = "packaged admin moves caller-ordered replicas between log directories"
description = "After one replicated record is stable, two caller-ordered public alteration batches first settle selected replicas in the primary directory and then move both to the secondary directory; every completion is followed by independently polled Kafka CLI state, and a final public description agrees with a fresh CLI snapshot."
timeout_ms = 180000
requires = ["producer", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-replica-move-topic"
topic = "testlab-kafkars-admin-replica-move"
partitions = 1
replication_factor = 3
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-replica-move-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-replica-move-marker"

[steps.record]
topic = "testlab-kafkars-admin-replica-move"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "replica-move" }
value = { encoding = "hex", data = "007265706c6963612d6d6f76652d7374617465ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-replica-move-marker" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "settle-replicas-in-primary-directory"
kind = "alter_replica_log_dirs"
client_id = "client-1"
operation_id = "admin-settle-replicas-primary"
timeout_ms = 30000

[[steps.assignments]]
topic = "testlab-kafkars-admin-replica-move"
partition = 0
broker_id = 3
target_path = "/tmp/kraft-combined-logs"

[[steps.assignments]]
topic = "testlab-kafkars-admin-replica-move"
partition = 0
broker_id = 1
target_path = "/tmp/kraft-combined-logs"

[[steps]]
id = "move-replicas-to-secondary-directory"
kind = "alter_replica_log_dirs"
client_id = "client-1"
operation_id = "admin-move-replicas-secondary"
timeout_ms = 30000

[[steps.assignments]]
topic = "testlab-kafkars-admin-replica-move"
partition = 0
broker_id = 1
target_path = "/tmp/kraft-secondary-logs"

[[steps.assignments]]
topic = "testlab-kafkars-admin-replica-move"
partition = 0
broker_id = 3
target_path = "/tmp/kraft-secondary-logs"

[[steps]]
id = "describe-moved-replica-log-dirs"
kind = "describe_replica_log_dirs"
client_id = "client-1"
operation_id = "admin-describe-moved-replica-log-dirs"
topic = "testlab-kafkars-admin-replica-move"
partition = 0
expected_replica_count = 3
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-replica-move-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
