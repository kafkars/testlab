schema_version = 146
id = "kafka.consumer-protocol-group-processing-acknowledgement"
title = "KIP-848 processing acknowledgement renews the commit window"
description = "A KIP-848 member processes one exact record for longer than its configured processing window, acknowledges the assignment-fenced checkpoint midway, and still commits the same batch with independent broker truth."
timeout_ms = 120000
requires = ["producer", "consumer_protocol_groups", "group_consumer_configuration", "group_consumer_acknowledge", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-consumer-acknowledged"
record = { topic = "testlab-consumer-processing-acknowledgement", partition = 0, sequence = 1, value = { encoding = "utf8", data = "consumer-acknowledged" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-consumer-acknowledged" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-consumer-processing-acknowledgement-group"
topics = ["testlab-consumer-processing-acknowledgement"]
protocol = "consumer"

[steps.configuration]
offset_reset = "earliest"
read_isolation = "read_uncommitted"
processing_timeout_ms = 5000
membership_start_timeout_ms = 30000
close_timeout_ms = 30000

[[steps]]
id = "receive-acknowledge-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-1"
expected_operation_id = "op-consumer-acknowledged"
processing_acknowledgement_delay_ms = 3000
timeout_ms = 45000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-consumer-acknowledged"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
