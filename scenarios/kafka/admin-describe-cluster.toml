schema_version = 97
id = "kafka.admin-describe-cluster"
title = "packaged client enforces and describes the independently observed Kafka cluster"
description = "The packaged client rejects a mismatched expected cluster ID without retaining a handle, accepts the environment's exact ID during construction and readiness, and publicly describes the cluster identity and broker IDs that an independent librdkafka query observes."
timeout_ms = 150000
requires = ["admin", "lifecycle", "client_readiness", "expected_cluster_identity"]
assertions = []

[[steps]]
id = "reject-mismatched-cluster"
kind = "create_client"
client_id = "client-1"
expected_cluster_id = "4L6g3nShT-eMCtK--X86sx"
expected_error_code = "identity"

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"
expected_cluster_id = "4L6g3nShT-eMCtK--X86sw"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-cluster"
kind = "describe_cluster"
client_id = "client-1"
operation_id = "admin-describe-cluster-1"
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
