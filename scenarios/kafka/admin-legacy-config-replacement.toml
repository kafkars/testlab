schema_version = 168
id = "kafka.admin-legacy-config-replacement"
title = "packaged admin replaces and restores legacy configuration snapshots"
description = "The packaged client's two public legacy full-snapshot configuration surfaces preserve caller order, restore broker defaults without receiving expected values, and use immediate independent reads to prove every distinct transition."
timeout_ms = 240000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-legacy-topic-configs-before"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-legacy-topic-config-before"
topics = [
  { topic = "testlab-kafkars-legacy-topic-config-zulu", config_name = "cleanup.policy", expected_value = "delete" },
  { topic = "testlab-kafkars-legacy-topic-config-alpha", config_name = "cleanup.policy", expected_value = "delete" },
]
timeout_ms = 20000

[[steps]]
id = "replace-legacy-topic-configs"
kind = "alter_topic_configs"
client_id = "client-1"
operation_id = "admin-legacy-topic-config-alter"
baseline_operation_id = "admin-legacy-topic-config-before"
api = "legacy_topic"
topics = [
  { topic = "testlab-kafkars-legacy-topic-config-zulu", config_name = "cleanup.policy", expected_previous_value = "delete", value = "compact" },
  { topic = "testlab-kafkars-legacy-topic-config-alpha", config_name = "cleanup.policy", expected_previous_value = "delete", value = "compact" },
]
timeout_ms = 20000

[[steps]]
id = "describe-legacy-topic-configs-after"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-legacy-topic-config-after"
topics = [
  { topic = "testlab-kafkars-legacy-topic-config-zulu", config_name = "cleanup.policy", expected_value = "compact" },
  { topic = "testlab-kafkars-legacy-topic-config-alpha", config_name = "cleanup.policy", expected_value = "compact" },
]
timeout_ms = 20000

[[steps]]
id = "restore-legacy-topic-config-defaults"
kind = "alter_topic_configs"
client_id = "client-1"
operation_id = "admin-legacy-topic-config-restore-default"
baseline_operation_id = "admin-legacy-topic-config-after"
api = "legacy_topic"
topics = [
  { topic = "testlab-kafkars-legacy-topic-config-zulu", config_name = "cleanup.policy", expected_previous_value = "compact", value = "delete", method = "restore_default" },
  { topic = "testlab-kafkars-legacy-topic-config-alpha", config_name = "cleanup.policy", expected_previous_value = "compact", value = "delete", method = "restore_default" },
]
timeout_ms = 20000

[[steps]]
id = "describe-restored-legacy-topic-configs"
kind = "describe_topic_configs"
client_id = "client-1"
operation_id = "admin-legacy-topic-config-restored"
topics = [
  { topic = "testlab-kafkars-legacy-topic-config-zulu", config_name = "cleanup.policy", expected_value = "delete" },
  { topic = "testlab-kafkars-legacy-topic-config-alpha", config_name = "cleanup.policy", expected_value = "delete" },
]
timeout_ms = 20000

