schema_version = 121
id = "kafka.admin-list-share-group-offsets"
title = "packaged admin lists independently observed Share-group offsets"
description = "After one record is accepted from a two-record Share partition, the packaged client's selected public Share-group offset listing preserves topic identity, start offset, leader epoch, and lag, and an immediate Kafka CLI query confirms the same start offset and lag."
timeout_ms = 180000
requires = ["producer", "share_consumer", "share_consumer_configuration", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-accepted-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offset-accepted"
record = { topic = "testlab-kafkars-admin-share-group-offsets", partition = 0, sequence = 1, value = { encoding = "utf8", data = "accepted" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offset-accepted" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "send-pending-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-share-offset-pending"
record = { topic = "testlab-kafkars-admin-share-group-offsets", partition = 0, sequence = 2, value = { encoding = "utf8", data = "pending" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-share-offset-pending" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }] }

[[steps]]
id = "flush-markers"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "create-share-consumer"
kind = "create_share_consumer"
client_id = "client-1"
consumer_id = "share-1"
group_id = "testlab-admin-share-group-offsets"
topics = ["testlab-kafkars-admin-share-group-offsets"]
membership_timeout_ms = 30000
close_timeout_ms = 30000

[steps.configuration]
max_wait_ms = 250
min_bytes = 1
max_bytes = 524288
max_records = 1
batch_size = 1
attempt_timeout_ms = 20000

[[steps]]
id = "receive-accepted-marker"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-share-offset-accepted"
expected_operation_ids = ["op-share-offset-accepted"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-accepted-marker"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-share-offset-accepted"
acknowledgement_id = "ack-share-offset-accepted"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "close-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-1"
expect_success = true

[[steps]]
id = "list-share-group-offsets"
kind = "list_share_group_offsets"
client_id = "client-1"
operation_id = "admin-list-share-group-offsets-1"
group_id = "testlab-admin-share-group-offsets"
topic = "testlab-kafkars-admin-share-group-offsets"
partition = 0
expected_start_offset = 1
expected_lag = 1
timeout_ms = 20000

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-share-offset-accepted"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-share-offset-pending"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
