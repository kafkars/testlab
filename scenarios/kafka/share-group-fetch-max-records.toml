schema_version = 37
id = "kafka.share-group-fetch-max-records"
title = "configured Share fetches bound each public delivery to one record"
description = "Three separately produced records enter one configured Share group, whose public max-records policy must expose and acknowledge exactly one independently observed record per retained batch."
timeout_ms = 180000
requires = ["producer", "share_consumer", "share_consumer_configuration", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-first"
kind = "send"
producer_id = "producer-1"
operation_id = "op-first"
record = { topic = "testlab-share-fetch-max-records", partition = 0, sequence = 1, value = { encoding = "utf8", data = "first" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-first" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "send-second"
kind = "send"
producer_id = "producer-1"
operation_id = "op-second"
record = { topic = "testlab-share-fetch-max-records", partition = 0, sequence = 2, value = { encoding = "utf8", data = "second" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-second" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }] }

[[steps]]
id = "send-third"
kind = "send"
producer_id = "producer-1"
operation_id = "op-third"
record = { topic = "testlab-share-fetch-max-records", partition = 0, sequence = 3, value = { encoding = "utf8", data = "third" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-third" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } }] }

[[steps]]
id = "create-share-consumer"
kind = "create_share_consumer"
client_id = "client-1"
consumer_id = "share-1"
group_id = "testlab-share-fetch-max-records"
topic = "testlab-share-fetch-max-records"
membership_timeout_ms = 30000
close_timeout_ms = 30000
configuration = { max_records = 1, batch_size = 1 }

[[steps]]
id = "receive-first"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-first"
expected_operation_ids = ["op-first"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-first"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-first"
acknowledgement_id = "ack-first"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "receive-second"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-second"
expected_operation_ids = ["op-second"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-second"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-second"
acknowledgement_id = "ack-second"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "receive-third"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-third"
expected_operation_ids = ["op-third"]
minimum_delivery_count = 1
expected_acquisition_count = 1
timeout_ms = 30000

[[steps]]
id = "acknowledge-third"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-third"
acknowledgement_id = "ack-third"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "close-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-1"
expect_success = true

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-first"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-second"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-third"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
