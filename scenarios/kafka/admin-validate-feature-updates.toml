schema_version = 167
id = "kafka.admin-validate-feature-updates"
title = "packaged admin validates a finalized-feature update without mutation"
description = "On Kafka 4.3.1, the packaged client's public update_features validation accepts the finalized metadata level in caller order while independent CLI snapshots prove feature state and epoch remain unchanged."
timeout_ms = 90000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-features-before"
kind = "describe_features"
client_id = "client-1"
operation_id = "admin-describe-features-before-validation"
expected_zk_migration_ready = false
timeout_ms = 20000

[[steps]]
id = "validate-feature-update"
kind = "validate_feature_updates"
client_id = "client-1"
operation_id = "admin-validate-feature-updates"
baseline_operation_id = "admin-describe-features-before-validation"
updates = [
  { name = "metadata.version", max_version_level = 30, kind = "upgrade" },
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
