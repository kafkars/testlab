schema_version = 13
id = "kafka.admin-create-topic"
title = "packaged admin creates a usable Kafka topic"
description = "The packaged client's public admin creates a topic that the harness did not pre-provision, then the packaged producer writes one independently observed exact record to it."
timeout_ms = 90000
requires = ["producer", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-1"
topic = "testlab-kafkars-admin-created"
partitions = 1
replication_factor = 1
timeout_ms = 20000

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-produced"

[steps.record]
topic = "testlab-kafkars-admin-created"
partition = 0
sequence = 1
key = { encoding = "hex", data = "0061646d696eff" }
value = { encoding = "hex", data = "0063726561746564ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-produced" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-produced"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
