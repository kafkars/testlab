schema_version = 37
id = "kafka.consumer-quota-progress"
title = "packaged consumer makes bounded progress under an observed byte-rate quota"
description = "An independently observed user consumer quota remains active for a bounded assigned receive of exact broker-visible bytes before the quota is removed."
timeout_ms = 150000
requires = ["producer", "assigned_consumer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "seed-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-quota-consumer"

[steps.record]
topic = "testlab-kafkars-consumer-quota"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "quota" }
value = { encoding = "utf8", data = "" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-quota-consumer" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }]

[[steps]]
id = "flush-seed"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-assigned-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-topic"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-consumer-quota"
partition = 0

[[steps]]
id = "limit-consumer-rate"
kind = "alter_broker_policy"
state = "present"
timeout_ms = 20000

[steps.policy]
policy_kind = "quota"
direction = "consumer"
bytes_per_second = 128
minimum_active_ms = 500

[[steps]]
id = "receive-under-quota"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-quota-consumer"
expected_operation_id = "op-quota-consumer"
timeout_ms = 30000

[[steps]]
id = "remove-consumer-limit"
kind = "alter_broker_policy"
state = "absent"
timeout_ms = 20000

[steps.policy]
policy_kind = "quota"
direction = "consumer"
bytes_per_second = 128
minimum_active_ms = 500

[[steps]]
id = "close-assigned-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-quota-consumer"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
