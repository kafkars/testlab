schema_version = 163
id = "kafka.assigned-consumer-immediate-batch"
title = "packaged assigned consumer exposes an immediate retained batch"
description = "The packaged client produces one exact record, directly assigns from the beginning, and returns that record through repeated public try_take_batch calls without substituting the waiting recv observer."
timeout_ms = 90000
requires = ["producer", "assigned_consumer", "assigned_consumer_immediate_batch", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-immediate-batch"

[steps.record]
topic = "testlab-kafkars-assigned-immediate-batch"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "immediate" }
value = { encoding = "utf8", data = "retained-batch" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-immediate-batch" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assigned-immediate-batch"
partition = 0

[[steps]]
id = "take-immediate-batch"
kind = "receive"
consumer_id = "consumer-1"
method = "try_take_batch"
receive_id = "receive-immediate-batch"
expected_operation_id = "op-immediate-batch"
timeout_ms = 20000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-immediate-batch"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
