kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "exercise-streams-group-default-options"
kind = "exercise_streams_group_admin_lifecycle"
client_id = "client-1"
operation_id = "admin-streams-group-default-options"
primary_group_id = "testlab-streams-default-primary"
secondary_group_id = "testlab-streams-default-secondary"
input_topic = "streams-plaintext-input"
output_topic = "streams-wordcount-output"
expected_initial_offset = 1
altered_offset = 0
include_authorized_operations = false
include_topology_description = false
