schema_version = 37
id = "kafka.classic-group-pause-resume"
title = "classic group pause and resume isolate one assigned partition"
description = "A stable one-member classic assignment pauses partition zero, commits partition one, resumes partition zero, and commits its exact broker record."
timeout_ms = 180000
requires = ["producer", "consumer_groups", "group_consumer_controls", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-classic-pause-group"
topic = "testlab-kafkars-classic-pause"
protocol = "classic"

[[steps]]
id = "observe-complete-assignment"
kind = "observe_group_assignments"
operation_id = "observe-assignment"
consumer_ids = ["consumer-1"]
partitions = [
  { topic = "testlab-kafkars-classic-pause", partition = 0 },
  { topic = "testlab-kafkars-classic-pause", partition = 1 },
]
timeout_ms = 30000

[[steps]]
id = "pause-partition-zero"
kind = "control_group_consumer"
operation_id = "control-pause"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "pause"
partitions = [
  { topic = "testlab-kafkars-classic-pause", partition = 0 },
]

[[steps]]
id = "send-paused-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-paused"

[steps.record]
topic = "testlab-kafkars-classic-pause"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "classic-paused" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-paused" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "send-active-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-active"

[steps.record]
topic = "testlab-kafkars-classic-pause"
partition = 1
sequence = 2
value = { encoding = "utf8", data = "classic-active" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-active" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "receive-active-partition"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-active"
expected_operation_id = "op-active"
timeout_ms = 30000

[[steps]]
id = "resume-partition-zero"
kind = "control_group_consumer"
operation_id = "control-resume"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "resume"
partitions = [
  { topic = "testlab-kafkars-classic-pause", partition = 0 },
]

[[steps]]
id = "receive-resumed-partition"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-resumed"
expected_operation_id = "op-paused"
timeout_ms = 30000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-paused"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-active"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
