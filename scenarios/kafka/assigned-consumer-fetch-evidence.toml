schema_version = 150
id = "kafka.assigned-consumer-fetch-evidence"
title = "packaged assigned consumer retains broker-correlated Fetch evidence"
description = "One direct Fetch exposes its topic UUID, request and progress offsets, broker bounds, retained-byte charge, and batch checkpoint against prior independent topic-ID, watermark, and record observations."
timeout_ms = 120000
requires = ["producer", "assigned_consumer", "assigned_consumer_fetch_evidence", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-fetch-evidence"

[steps.record]
topic = "testlab-kafkars-assigned-fetch-evidence"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "fetch-evidence" }
value = { encoding = "utf8", data = "broker-correlated" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-fetch-evidence" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "describe-topic-id"
kind = "describe_topics"
client_id = "client-1"
operation_id = "admin-fetch-topic-id"
selection = "topic_id"
include_authorized_operations = false
topics = [
  { topic = "testlab-kafkars-assigned-fetch-evidence", expected_partitions = [0] },
]
timeout_ms = 20000

[[steps]]
id = "observe-watermarks"
kind = "list_offsets_batch"
client_id = "client-1"
operation_id = "admin-fetch-watermarks"
queries = [
  { topic = "testlab-kafkars-assigned-fetch-evidence", partition = 0, position = "latest", expected_offset = 1 },
]
timeout_ms = 20000

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assigned-fetch-evidence"
partition = 0

[[steps]]
id = "receive-fetch-evidence"
kind = "receive"
consumer_id = "consumer-1"
observe_fetch_evidence = true
receive_id = "receive-fetch-evidence"
expected_operation_id = "op-fetch-evidence"
timeout_ms = 20000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-fetch-evidence"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
