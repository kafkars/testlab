schema_version = 75
id = "kafka.admin-topic-ids"
title = "packaged admin describes and deletes caller-ordered topic IDs"
description = "Scenario-owned names resolve to Kafka UUIDs; one public ID-keyed description preserves both identities and topology against pinned Kafka CLI snapshots, then one public ID-keyed deletion uses those same independently proven identities and polling metadata confirms absence."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-topics-by-id"
kind = "describe_topics"
client_id = "client-1"
operation_id = "admin-describe-topics-by-id"
selection = "topic_id"
topics = [
  { topic = "testlab-kafkars-admin-topic-ids-zulu", expected_partitions = [0, 1] },
  { topic = "testlab-kafkars-admin-topic-ids-alpha", expected_partitions = [0] },
]
timeout_ms = 20000

[[steps]]
id = "delete-topics-by-id"
kind = "delete_topics"
client_id = "client-1"
operation_id = "admin-delete-topics-by-id"
selection = "topic_id"
topics = [
  { topic = "testlab-kafkars-admin-topic-ids-zulu" },
  { topic = "testlab-kafkars-admin-topic-ids-alpha" },
]
timeout_ms = 30000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
