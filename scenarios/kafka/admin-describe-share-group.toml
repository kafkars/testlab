schema_version = 110
id = "kafka.admin-describe-share-group"
title = "packaged admin describes a configured Share rack and active assignment"
description = "While one rack-configured Share member retains an acquired record, the packaged client's public Share-group description preserves its stable state, epochs, assignor, rack, subscription, topic identity, and partition assignment, and an immediate Kafka CLI query confirms the same state and member count."
timeout_ms = 180000
requires = ["producer", "share_consumer", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-share-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-describe-share-group-marker"

[steps.record]
topic = "testlab-kafkars-admin-share-group-described"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "describe-share-group" }
value = { encoding = "utf8", data = "active-member" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-describe-share-group-marker" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-marker"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "create-share-consumer"
kind = "create_share_consumer"
client_id = "client-1"
consumer_id = "share-1"
group_id = "testlab-admin-described-share-group"
topics = ["testlab-kafkars-admin-share-group-described"]
rack = "testlab-rack-single"
membership_timeout_ms = 30000
close_timeout_ms = 30000

[[steps]]
id = "retain-share-batch"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-describe-share-group"
expected_operation_ids = ["op-describe-share-group-marker"]
minimum_delivery_count = 1
timeout_ms = 30000

[[steps]]
id = "describe-active-share-group"
kind = "describe_share_group"
client_id = "client-1"
operation_id = "admin-describe-share-group-1"
group_id = "testlab-admin-described-share-group"
expected_state = "Stable"
expected_member_count = 1
expected_rack_id = "testlab-rack-single"
expected_topic = "testlab-kafkars-admin-share-group-described"
expected_partition = 0
timeout_ms = 20000

[[steps]]
id = "acknowledge-marker"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-describe-share-group"
acknowledgement_id = "ack-describe-share-group"
dispositions = ["accept"]
timeout_ms = 30000

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "close-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-1"
expect_success = true

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-describe-share-group-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
