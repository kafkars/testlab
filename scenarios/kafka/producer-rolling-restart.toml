schema_version = 13
id = "kafka.producer-rolling-restart"
title = "packaged producer survives a three-broker rolling restart"
description = "One live packaged producer acknowledges an exact record before and after each broker in a three-node Kafka cluster is restarted in turn."
timeout_ms = 240000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-initial"
kind = "send"
producer_id = "producer-1"
operation_id = "op-initial"

[steps.record]
topic = "testlab-kafkars-rolling-restart"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "initial" }
value = { encoding = "utf8", data = "before-rolling-restart" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-initial" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "restart-broker-1"
kind = "restart_broker"
broker_ordinal = 1
timeout_ms = 45000

[[steps]]
id = "send-after-broker-1"
kind = "send"
producer_id = "producer-1"
operation_id = "op-after-broker-1"

[steps.record]
topic = "testlab-kafkars-rolling-restart"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "broker-1" }
value = { encoding = "utf8", data = "after-broker-1" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-after-broker-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "restart-broker-2"
kind = "restart_broker"
broker_ordinal = 2
timeout_ms = 45000

[[steps]]
id = "send-after-broker-2"
kind = "send"
producer_id = "producer-1"
operation_id = "op-after-broker-2"

[steps.record]
topic = "testlab-kafkars-rolling-restart"
partition = 0
sequence = 3
key = { encoding = "utf8", data = "broker-2" }
value = { encoding = "utf8", data = "after-broker-2" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-after-broker-2" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps]]
id = "restart-broker-3"
kind = "restart_broker"
broker_ordinal = 3
timeout_ms = 45000

[[steps]]
id = "send-after-broker-3"
kind = "send"
producer_id = "producer-1"
operation_id = "op-after-broker-3"

[steps.record]
topic = "testlab-kafkars-rolling-restart"
partition = 0
sequence = 4
key = { encoding = "utf8", data = "broker-3" }
value = { encoding = "utf8", data = "after-broker-3" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-after-broker-3" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "4" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-initial"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-after-broker-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-after-broker-2"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-after-broker-3"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
