schema_version = 145
id = "kafka.admin-delete-topics"
title = "packaged admin deletes caller-ordered topics with mixed outcomes"
description = "A prior caller-ordered description proves two topics present and one absent; one public plural deletion preserves exact mixed outcomes while polling independent metadata proves every selected topic absent."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-topics"
kind = "describe_topics"
client_id = "client-1"
operation_id = "admin-describe-topics-before-delete"
include_authorized_operations = false
topics = [
  { topic = "testlab-kafkars-admin-delete-topics-zulu", expected_partitions = [0, 1] },
  { topic = "testlab-kafkars-admin-delete-topics-missing", expected_error_code = "broker:broker_3" },
  { topic = "testlab-kafkars-admin-delete-topics-alpha", expected_partitions = [0] },
]
timeout_ms = 20000

[[steps]]
id = "delete-topics"
kind = "delete_topics"
client_id = "client-1"
operation_id = "admin-delete-topics"
topics = [
  { topic = "testlab-kafkars-admin-delete-topics-zulu" },
  { topic = "testlab-kafkars-admin-delete-topics-missing", expected_error_code = "broker:broker_3" },
  { topic = "testlab-kafkars-admin-delete-topics-alpha" },
]
timeout_ms = 30000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
