schema_version = 9
id = "kafka.producer-round-trip"
title = "packaged producer record is independently visible"
description = "One packaged-client send is acknowledged and independently observed once with exact Kafka bytes."
timeout_ms = 60000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-1"

[steps.record]
topic = "testlab-kafkars-round-trip"
partition = 0
sequence = 1
key = { encoding = "hex", data = "006b6579ff" }
value = { encoding = "hex", data = "0076616c7565ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
  { name = "binary", value = { encoding = "hex", data = "00ff" } },
  { name = "nullable" },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
