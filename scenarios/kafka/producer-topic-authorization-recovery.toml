schema_version = 37
id = "kafka.producer-topic-authorization-recovery"
title = "packaged producer reports topic denial and recovers after permission restoration"
description = "An independently observed topic WRITE deny ACL forces the exact public producer error and broker absence, then its observed removal permits one acknowledged exact record."
timeout_ms = 120000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "deny-topic-write"
kind = "alter_broker_policy"
state = "present"
timeout_ms = 20000

[steps.policy]
policy_kind = "acl"
operation = "write"

[steps.policy.resource]
resource_kind = "topic"
name = "testlab-kafkars-policy-producer"

[[steps]]
id = "send-denied-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-denied"

[steps.record]
topic = "testlab-kafkars-policy-producer"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "denied" }
value = { encoding = "utf8", data = "topic-write-denied" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-denied" } }]

[[steps]]
id = "flush-denied-record"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "restore-topic-write"
kind = "alter_broker_policy"
state = "absent"
timeout_ms = 20000

[steps.policy]
policy_kind = "acl"
operation = "write"

[steps.policy.resource]
resource_kind = "topic"
name = "testlab-kafkars-policy-producer"

[[steps]]
id = "send-recovery-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-recovered"

[steps.record]
topic = "testlab-kafkars-policy-producer"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "recovered" }
value = { encoding = "utf8", data = "topic-write-restored" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-recovered" } }]

[[steps]]
id = "flush-recovery-record"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-denied"
accepted = true
terminal = "definitely_not_sent"
visibility = "absent"
expected_error_code = "access:broker_29"

[[assertions]]
operation_id = "op-recovered"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
