schema_version = 37
id = "kafka.assigned-consumer-seek-replay"
title = "an assigned consumer seek replays an exact broker record"
description = "The packaged direct consumer reads one record, seeks the same partition to the beginning through the public control, and reads the same broker coordinate again."
timeout_ms = 120000
requires = ["producer", "assigned_consumer", "assigned_consumer_controls", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-replayed"

[steps.record]
topic = "testlab-kafkars-assigned-seek"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "replayed" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-replayed" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-beginning"
kind = "control_assigned_consumer"
operation_id = "control-beginning"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "replace"
partitions = [
  { topic = "testlab-kafkars-assigned-seek", partition = 0, position = { kind = "beginning" } },
]

[[steps]]
id = "receive-first"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-first"
expected_operation_id = "op-replayed"
timeout_ms = 30000

[[steps]]
id = "seek-beginning"
kind = "control_assigned_consumer"
operation_id = "control-seek"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "seek"
partition = { topic = "testlab-kafkars-assigned-seek", partition = 0 }
position = { kind = "beginning" }

[[steps]]
id = "receive-replay"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-replay"
expected_operation_id = "op-replayed"
timeout_ms = 30000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-replayed"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
