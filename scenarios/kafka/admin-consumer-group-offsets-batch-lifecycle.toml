schema_version = 37
id = "kafka.admin-consumer-group-offsets-batch-lifecycle"
title = "packaged admin lists alters and deletes multiple consumer-group offsets"
description = "One classic group commits offset 1 on two topics, then ordered public batch listings and independent broker snapshots prove a plural reset to offset 0 and plural deletion of both committed offsets."
timeout_ms = 240000
requires = ["producer", "consumer_groups", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-alpha-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-admin-batch-alpha"

[steps.record]
topic = "testlab-kafkars-admin-offset-batch-alpha"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "alpha" }
value = { encoding = "utf8", data = "checkpoint-one" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-admin-batch-alpha" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "send-beta-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-admin-batch-beta"

[steps.record]
topic = "testlab-kafkars-admin-offset-batch-beta"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "beta" }
value = { encoding = "utf8", data = "checkpoint-one" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-admin-batch-beta" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-alpha-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-alpha"
group_id = "testlab-admin-offset-batch-group"
topic = "testlab-kafkars-admin-offset-batch-alpha"
protocol = "classic"

[[steps]]
id = "receive-alpha"
kind = "group_receive"
consumer_id = "consumer-alpha"
receive_id = "receive-admin-batch-alpha"
expected_operation_id = "op-admin-batch-alpha"
timeout_ms = 30000

[[steps]]
id = "close-alpha-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-alpha"

[[steps]]
id = "create-beta-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-beta"
group_id = "testlab-admin-offset-batch-group"
topic = "testlab-kafkars-admin-offset-batch-beta"
protocol = "classic"

[[steps]]
id = "receive-beta"
kind = "group_receive"
consumer_id = "consumer-beta"
receive_id = "receive-admin-batch-beta"
expected_operation_id = "op-admin-batch-beta"
timeout_ms = 30000

[[steps]]
id = "close-beta-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-beta"

[[steps]]
id = "list-batch-before-alter"
kind = "list_consumer_group_offsets_batch"
client_id = "client-1"
operation_id = "admin-offset-batch-before"
group_id = "testlab-admin-offset-batch-group"
require_stable = true
partitions = [
  { topic = "testlab-kafkars-admin-offset-batch-beta", partition = 0, expected_offset = 1 },
  { topic = "testlab-kafkars-admin-offset-batch-alpha", partition = 0, expected_offset = 1 },
]
timeout_ms = 20000

[[steps]]
id = "alter-offsets-batch"
kind = "alter_consumer_group_offsets"
client_id = "client-1"
operation_id = "admin-offset-batch-alter"
group_id = "testlab-admin-offset-batch-group"
offsets = [
  { topic = "testlab-kafkars-admin-offset-batch-alpha", partition = 0, offset = 0 },
  { topic = "testlab-kafkars-admin-offset-batch-beta", partition = 0, offset = 0 },
]
timeout_ms = 20000

[[steps]]
id = "list-batch-after-alter"
kind = "list_consumer_group_offsets_batch"
client_id = "client-1"
operation_id = "admin-offset-batch-after"
group_id = "testlab-admin-offset-batch-group"
require_stable = true
partitions = [
  { topic = "testlab-kafkars-admin-offset-batch-beta", partition = 0, expected_offset = 0 },
  { topic = "testlab-kafkars-admin-offset-batch-alpha", partition = 0, expected_offset = 0 },
]
timeout_ms = 20000

[[steps]]
id = "delete-offsets-batch"
kind = "delete_consumer_group_offsets"
client_id = "client-1"
operation_id = "admin-offset-batch-delete"
group_id = "testlab-admin-offset-batch-group"
partitions = [
  { topic = "testlab-kafkars-admin-offset-batch-beta", partition = 0 },
  { topic = "testlab-kafkars-admin-offset-batch-alpha", partition = 0 },
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-admin-batch-alpha"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-admin-batch-beta"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
