schema_version = 136
id = "kafka.admin-fence-producers"
title = "packaged admin fences caller-ordered transactional producers"
description = "Two initialized and closed transactional producers are fenced through one public caller-ordered Admin batch; every returned identity and epoch must match immediate pinned Kafka CLI descriptions, whose positive transaction timeout is bounded by the public deadline."
timeout_ms = 90000
requires = ["transactions", "admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-zulu-transaction"
kind = "create_transactional_producer"
client_id = "client-1"
producer_id = "transactional-producer-zulu"
transactional_id = "testlab-admin-fence-zulu"
transaction_timeout_ms = 30000
initialization_timeout_ms = 30000

[[steps]]
id = "close-zulu-transaction"
kind = "close_transactional_producer"
producer_id = "transactional-producer-zulu"

[[steps]]
id = "create-alpha-transaction"
kind = "create_transactional_producer"
client_id = "client-1"
producer_id = "transactional-producer-alpha"
transactional_id = "testlab-admin-fence-alpha"
transaction_timeout_ms = 30000
initialization_timeout_ms = 30000

[[steps]]
id = "close-alpha-transaction"
kind = "close_transactional_producer"
producer_id = "transactional-producer-alpha"

[[steps]]
id = "fence-producers"
kind = "fence_producers"
client_id = "client-1"
operation_id = "admin-fence-producers"
timeout_ms = 20000

[[steps.producers]]
transactional_id = "testlab-admin-fence-zulu"
expected_state = "Empty"
expected_start_time_present = false
expected_topics = []

[[steps.producers]]
transactional_id = "testlab-admin-fence-alpha"
expected_state = "Empty"
expected_start_time_present = false
expected_topics = []

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
