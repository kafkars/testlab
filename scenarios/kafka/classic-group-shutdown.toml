schema_version = 37
id = "kafka.classic-group-shutdown"
title = "classic group clone-shared shutdown terminates and leaves"
description = "After a classic member publicly receives and commits an exact record, one clone-shared shutdown request terminates its public event stream; packaged Admin and an immediate independent broker query then both report zero live members."
timeout_ms = 150000
requires = ["producer", "consumer_groups", "group_consumer_shutdown", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-shutdown-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-classic-shutdown-marker"

[steps.record]
topic = "testlab-kafkars-classic-shutdown"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "classic-shutdown" }
value = { encoding = "utf8", data = "live-before-request" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-classic-shutdown-marker" } }]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-classic-member"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-classic-shutdown-group"
topic = "testlab-kafkars-classic-shutdown"
protocol = "classic"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-classic-shutdown"
expected_operation_id = "op-classic-shutdown-marker"
timeout_ms = 30000

[[steps]]
id = "request-and-observe-shutdown"
kind = "shutdown_group_consumer"
operation_id = "shutdown-classic-member"
consumer_id = "consumer-1"
request_count = 1
timeout_ms = 45000

[[steps]]
id = "describe-empty-group"
kind = "describe_consumer_group"
client_id = "client-1"
operation_id = "describe-classic-after-shutdown"
group_id = "testlab-classic-shutdown-group"
expected_member_count = 0
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-classic-shutdown-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
