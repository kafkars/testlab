schema_version = 12
id = "kafka.producer-batch"
title = "packaged producer sends one ordered batch"
description = "One packaged-client batch call admits three identified records, settles each delivery, and leaves exact independently observed Kafka records."
timeout_ms = 90000
requires = ["producer", "producer_batch", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-batch"
kind = "send_batch"
producer_id = "producer-1"

[[steps.operations]]
operation_id = "op-batch-0"

[steps.operations.record]
topic = "testlab-kafkars-producer-batch"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "batch-0" }
value = { encoding = "hex", data = "0062617463682d30ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-batch-0" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps.operations]]
operation_id = "op-batch-1"

[steps.operations.record]
topic = "testlab-kafkars-producer-batch"
partition = 1
sequence = 2
key = { encoding = "utf8", data = "batch-1" }
value = { encoding = "hex", data = "0062617463682d31ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-batch-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps.operations]]
operation_id = "op-batch-2"

[steps.operations.record]
topic = "testlab-kafkars-producer-batch"
partition = 2
sequence = 3
key = { encoding = "utf8", data = "batch-2" }
value = { encoding = "hex", data = "0062617463682d32ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-batch-2" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-batch-0"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-batch-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-batch-2"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
