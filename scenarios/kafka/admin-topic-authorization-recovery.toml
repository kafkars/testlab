schema_version = 37
id = "kafka.admin-topic-authorization-recovery"
title = "packaged admin reports topic denial and recovers after permission restoration"
description = "An independently observed topic CREATE deny ACL forces the exact public admin error while metadata confirms absence, then its observed removal permits creation of that same topic."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "deny-topic-create"
kind = "alter_broker_policy"
state = "present"
timeout_ms = 20000

[steps.policy]
policy_kind = "acl"
operation = "create"

[steps.policy.resource]
resource_kind = "topic"
name = "testlab-kafkars-policy-admin"

[[steps]]
id = "create-topic-denied"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-denied"
topic = "testlab-kafkars-policy-admin"
partitions = 2
replication_factor = 1
validate_only = false
expected_error_code = "broker:broker_29"
timeout_ms = 20000

[[steps]]
id = "restore-topic-create"
kind = "alter_broker_policy"
state = "absent"
timeout_ms = 20000

[steps.policy]
policy_kind = "acl"
operation = "create"

[steps.policy.resource]
resource_kind = "topic"
name = "testlab-kafkars-policy-admin"

[[steps]]
id = "create-topic-recovered"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-recovered"
topic = "testlab-kafkars-policy-admin"
partitions = 2
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
