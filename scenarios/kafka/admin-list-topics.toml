schema_version = 14
id = "kafka.admin-list-topics"
title = "packaged admin lists an independently observed Kafka topic"
description = "The packaged client's public all-topic query includes one required harness-provisioned topic whose partition is later proven by one exact independent broker observation."
timeout_ms = 90000
requires = ["producer", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "list-topics"
kind = "list_topics"
client_id = "client-1"
operation_id = "admin-list-topics-1"
include_internal = false
required_topics = ["testlab-kafkars-admin-listed"]
timeout_ms = 20000

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-listed-topic-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-listed-topic"

[steps.record]
topic = "testlab-kafkars-admin-listed"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "listed-topic" }
value = { encoding = "hex", data = "006c69737465642d746f706963ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-listed-topic" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-listed-topic"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
