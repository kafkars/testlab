schema_version = 3
id = "kafka.producer-partition-routing"
title = "packaged producer routes exact records across partitions"
description = "Three packaged-client sends target distinct partitions and remain independently visible once with exact Kafka bytes."
timeout_ms = 90000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-partition-0"
kind = "send"
producer_id = "producer-1"
operation_id = "op-partition-0"

[steps.record]
topic = "testlab-kafkars-partition-routing"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "partition-0" }
value = { encoding = "hex", data = "00726f7574652d30ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-partition-0" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "send-partition-1"
kind = "send"
producer_id = "producer-1"
operation_id = "op-partition-1"

[steps.record]
topic = "testlab-kafkars-partition-routing"
partition = 1
sequence = 2
key = { encoding = "utf8", data = "partition-1" }
value = { encoding = "hex", data = "00726f7574652d31ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-partition-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "send-partition-2"
kind = "send"
producer_id = "producer-1"
operation_id = "op-partition-2"

[steps.record]
topic = "testlab-kafkars-partition-routing"
partition = 2
sequence = 3
key = { encoding = "utf8", data = "partition-2" }
value = { encoding = "hex", data = "00726f7574652d32ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-partition-2" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-partition-0"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-partition-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-partition-2"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
