schema_version = 141
id = "kafka.consumer-protocol-group-immediate-batch"
title = "KIP-848 group receives through immediate batch observation"
description = "A KIP-848 member repeatedly calls the public try_take_batch method, returns one exact broker-visible record, and commits its checkpoint."
timeout_ms = 120000
requires = ["producer", "consumer_protocol_groups", "group_consumer_immediate_batch", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-produced"

[steps.record]
topic = "testlab-consumer-protocol-group-immediate-batch"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "immediate" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-produced" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-consumer-protocol-group-immediate-batch-group"
topics = ["testlab-consumer-protocol-group-immediate-batch"]
protocol = "consumer"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
method = "try_take_batch"
receive_id = "receive-1"
expected_operation_id = "op-produced"
timeout_ms = 30000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-produced"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
