schema_version = 37
id = "kafka.admin-describe-classic-groups"
title = "packaged admin describes multiple live classic consumer groups"
description = "Two live classic members each receive and commit an exact marker, then the dedicated packaged classic-group API returns both groups in caller order while one independent broker snapshot confirms their member counts."
timeout_ms = 200000
requires = ["producer", "consumer_groups", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-alpha-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-classic-description-alpha"

[steps.record]
topic = "testlab-kafkars-admin-classic-alpha"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "classic-alpha" }
value = { encoding = "utf8", data = "live-member" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-classic-description-alpha" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "send-zulu-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-classic-description-zulu"

[steps.record]
topic = "testlab-kafkars-admin-classic-zulu"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "classic-zulu" }
value = { encoding = "utf8", data = "live-member" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-classic-description-zulu" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-alpha-classic-group"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-alpha"
group_id = "testlab-admin-classic-alpha"
topic = "testlab-kafkars-admin-classic-alpha"
protocol = "classic"

[[steps]]
id = "receive-alpha"
kind = "group_receive"
consumer_id = "consumer-alpha"
receive_id = "receive-classic-description-alpha"
expected_operation_id = "op-classic-description-alpha"
timeout_ms = 30000

[[steps]]
id = "create-zulu-classic-group"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-zulu"
group_id = "testlab-admin-classic-zulu"
topic = "testlab-kafkars-admin-classic-zulu"
protocol = "classic"

[[steps]]
id = "receive-zulu"
kind = "group_receive"
consumer_id = "consumer-zulu"
receive_id = "receive-classic-description-zulu"
expected_operation_id = "op-classic-description-zulu"
timeout_ms = 30000

[[steps]]
id = "describe-classic-groups"
kind = "describe_classic_groups"
client_id = "client-1"
operation_id = "admin-describe-classic-groups"
groups = [
  { group_id = "testlab-admin-classic-zulu", expected_member_count = 1 },
  { group_id = "testlab-admin-classic-alpha", expected_member_count = 1 },
]
timeout_ms = 20000

[[steps]]
id = "close-zulu-classic-group"
kind = "close_group_consumer"
consumer_id = "consumer-zulu"

[[steps]]
id = "close-alpha-classic-group"
kind = "close_group_consumer"
consumer_id = "consumer-alpha"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-classic-description-alpha"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-classic-description-zulu"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
