schema_version = 134
id = "kafka.consumer-protocol-group-missing-offset-error"
title = "KIP-848 group fails closed when no committed offset exists"
description = "A new KIP-848 group configured with the public error reset policy reports the exact state failure instead of guessing an initial position."
timeout_ms = 120000
requires = ["producer", "consumer_protocol_groups", "group_consumer_configuration", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "seed-topic"
kind = "send"
producer_id = "producer-1"
operation_id = "op-seed"

[steps.record]
topic = "testlab-consumer-protocol-missing-offset-error"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "seed" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-seed" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-fail-closed-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-consumer-protocol-missing-offset-error-group"
topics = ["testlab-consumer-protocol-missing-offset-error"]
protocol = "consumer"

[steps.configuration]
offset_reset = "error"
read_isolation = "read_uncommitted"

[[steps]]
id = "receive-without-committed-offset"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-missing-offset"
expected_operation_id = "op-seed"
expected_error_code = "state"
timeout_ms = 30000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-seed"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
