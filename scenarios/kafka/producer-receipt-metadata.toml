schema_version = 159
id = "kafka.producer-receipt-metadata"
title = "ordinary producer receipts retain UUID and serialization truth"
description = "Two UUID-bound ordinary sends retain the exact public topic, topic ID, leader epoch, coordinates, timestamp, and nullable serialized sizes; independent topic and record observations prove the broker facts."
timeout_ms = 120000
requires = ["producer", "producer_receipt_metadata", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "describe-topic-identity"
kind = "describe_topics"
client_id = "client-1"
operation_id = "producer-receipt-topic-identity"
selection = "topic_id"
include_authorized_operations = false
topics = [{ topic = "testlab-producer-receipt-metadata", expected_partitions = [0] }]
timeout_ms = 20000

[[steps]]
id = "send-null-key-empty-value"
kind = "send"
producer_id = "producer-1"
operation_id = "op-receipt-null-key"
topic_identity_operation_id = "producer-receipt-topic-identity"
record = { topic = "testlab-producer-receipt-metadata", partition = 0, sequence = 1, timestamp_millis = 1700000001000, value = { encoding = "hex", data = "" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-receipt-null-key" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "send-empty-key-null-value"
kind = "send"
producer_id = "producer-1"
operation_id = "op-receipt-null-value"
topic_identity_operation_id = "producer-receipt-topic-identity"
record = { topic = "testlab-producer-receipt-metadata", partition = 0, sequence = 2, timestamp_millis = 1700000002000, key = { encoding = "hex", data = "" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-receipt-null-value" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } }] }

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-receipt-null-key"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-receipt-null-value"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
