schema_version = 149
id = "kafka.assigned-consumer-direct-owned-records-transfer"
title = "direct owned-record conversion preserves a source through producer settlement"
description = "A packaged direct consumer calls RecordBatch::into_owned_records for one batch, transfers that record to a producer, and retains exact source evidence through the independently observed destination terminal."
timeout_ms = 120000
requires = ["producer", "assigned_consumer", "assigned_consumer_record_transfer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-direct-owned-record-source"
kind = "send"
producer_id = "producer-1"
operation_id = "direct-owned-record-source"

[steps.record]
topic = "testlab-kafkars-direct-owned-record-source"
partition = 0
sequence = 1
timestamp_millis = 1700000004000
key = { encoding = "hex", data = "" }
value = { encoding = "hex", data = "00ff3040" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "direct-owned-record-source" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
  { name = "trace", value = { encoding = "hex", data = "00ff" } },
  { name = "trace" },
  { name = "trace", value = { encoding = "hex", data = "" } },
]

[[steps]]
id = "flush-source"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-source"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-direct-owned-record-source"
partition = 0

[[steps]]
id = "transfer-owned-records-directly"
kind = "transfer_assigned_record"
consumer_id = "consumer-1"
producer_id = "producer-1"
operation_id = "direct-owned-record-destination"
expected_input_operation_id = "direct-owned-record-source"
method = "into_owned_records"
target_topic = "testlab-kafkars-direct-owned-record-destination"
target_partition = 1
timeout_ms = 30000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "direct-owned-record-source"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "direct-owned-record-destination"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
