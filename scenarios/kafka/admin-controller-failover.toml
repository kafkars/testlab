schema_version = 37
id = "kafka.admin-controller-failover"
title = "admin mutation recovers across an observed controller election"
description = "Testlab independently selects and stops the active Kafka controller, proves a distinct replacement, and the packaged admin creates one exact topic with immediate independent metadata while the original controller remains offline."
timeout_ms = 180000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "stop-controller"
kind = "stop_broker_role"
timeout_ms = 45000
[steps.target]
role = "controller"

[[steps]]
id = "create-topic-after-election"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-after-controller-election"
topic = "testlab-kafkars-controller-failover"
partitions = 3
replication_factor = 2
validate_only = false
timeout_ms = 45000

[[steps]]
id = "restore-controller"
kind = "restore_broker_role"
timeout_ms = 45000
[steps.target]
role = "controller"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
