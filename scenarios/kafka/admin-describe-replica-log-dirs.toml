schema_version = 160
id = "kafka.admin-describe-replica-log-dirs"
title = "packaged admin describes exact replica log-directory placements"
description = "After creating a one-replica topic and writing one exact record, the packaged client must query that topic-partition on every discovered broker in descending order and preserve each current or absent placement exactly as Kafka's pinned log-directory CLI observes it."
timeout_ms = 90000
requires = ["producer", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-replica-log-dir-topic"
topic = "testlab-kafkars-admin-replica-log-dirs"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-replica-log-dir-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-replica-log-dir-marker"

[steps.record]
topic = "testlab-kafkars-admin-replica-log-dirs"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "replica-log-dir" }
value = { encoding = "hex", data = "007265706c6963612d6c6f672d6469722d7374617465ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-replica-log-dir-marker" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "describe-replica-log-dirs"
kind = "describe_replica_log_dirs"
client_id = "client-1"
operation_id = "admin-describe-replica-log-dirs"
topic = "testlab-kafkars-admin-replica-log-dirs"
partition = 0
expected_replica_count = 1
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-replica-log-dir-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
