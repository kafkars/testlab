schema_version = 145
id = "kafka.admin-list-client-metrics-resources"
title = "packaged admin lists configured client-metrics resources"
description = "After Testlab provisions two named client-metrics configurations through Kafka's pinned CLI, the packaged client's dedicated public listing returns the exact canonical resource set and an immediate independent CLI listing corroborates it."
timeout_ms = 90000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "list-client-metrics-resources"
kind = "list_config_resources"
client_id = "client-1"
operation_id = "admin-list-client-metrics-resources"
api = "client_metrics"
required_resources = [
  "testlab-kafkars-client-metrics-zulu",
  "testlab-kafkars-client-metrics-alpha",
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
