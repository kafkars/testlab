schema_version = 37
id = "kafka.classic-group-broker-restart"
title = "packaged classic group member recovers after a broker restart"
description = "One live classic group member receives and commits exact records before and after testlab restarts its Kafka broker."
timeout_ms = 180000
requires = ["producer", "consumer_groups", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-before-restart"
kind = "send"
producer_id = "producer-1"
operation_id = "op-before-restart"

[steps.record]
topic = "testlab-kafkars-group-restart"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "before" }
value = { encoding = "utf8", data = "before-restart" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-before-restart" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-classic-group-restart"
topic = "testlab-kafkars-group-restart"
protocol = "classic"

[[steps]]
id = "receive-before-restart"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-before-restart"
expected_operation_id = "op-before-restart"
timeout_ms = 45000

[[steps]]
id = "restart-broker"
kind = "restart_broker"
broker_ordinal = 1
timeout_ms = 45000

[[steps]]
id = "send-after-restart"
kind = "send"
producer_id = "producer-1"
operation_id = "op-after-restart"

[steps.record]
topic = "testlab-kafkars-group-restart"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "after" }
value = { encoding = "utf8", data = "after-restart" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-after-restart" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "receive-after-restart"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-after-restart"
expected_operation_id = "op-after-restart"
timeout_ms = 45000

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-before-restart"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-after-restart"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
