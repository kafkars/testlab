schema_version = 37
id = "kafka.share-group-fetch-batch-size"
title = "configured Share fetches preserve one-record acquisition ranges"
description = "One configured Share fetch returns three independently observed records together while the public batch proves that Kafka divided them into three one-record acquisition ranges."
timeout_ms = 180000
requires = ["producer", "producer_batch", "share_consumer", "share_consumer_configuration", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-share-batch"
kind = "send_batch"
producer_id = "producer-1"

[[steps.operations]]
operation_id = "op-first"
record = { topic = "testlab-share-fetch-batch-size", partition = 0, sequence = 1, value = { encoding = "utf8", data = "first" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-first" } }] }

[[steps.operations]]
operation_id = "op-second"
record = { topic = "testlab-share-fetch-batch-size", partition = 0, sequence = 2, value = { encoding = "utf8", data = "second" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-second" } }] }

[[steps.operations]]
operation_id = "op-third"
record = { topic = "testlab-share-fetch-batch-size", partition = 0, sequence = 3, value = { encoding = "utf8", data = "third" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-third" } }] }

[[steps]]
id = "create-share-consumer"
kind = "create_share_consumer"
client_id = "client-1"
consumer_id = "share-1"
group_id = "testlab-share-fetch-batch-size"
topic = "testlab-share-fetch-batch-size"
membership_timeout_ms = 30000
close_timeout_ms = 30000
configuration = { max_records = 3, batch_size = 1 }

[[steps]]
id = "receive-three-acquisitions"
kind = "share_receive"
consumer_id = "share-1"
receive_id = "receive-three"
expected_operation_ids = ["op-first", "op-second", "op-third"]
minimum_delivery_count = 1
expected_acquisition_count = 3
timeout_ms = 30000

[[steps]]
id = "acknowledge-three-acquisitions"
kind = "share_acknowledge"
consumer_id = "share-1"
receive_id = "receive-three"
acknowledgement_id = "ack-three"
dispositions = ["accept", "accept", "accept"]
timeout_ms = 30000

[[steps]]
id = "close-share-consumer"
kind = "close_share_consumer"
consumer_id = "share-1"
expect_success = true

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-first"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-second"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-third"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
