schema_version = 148
id = "kafka.producer-explicit-timestamp"
title = "an explicit producer timestamp survives broker and consumer boundaries"
description = "One packaged producer submits a caller-selected timestamp; its public receipt, an independent broker observation, and a directly assigned public consumer must all retain the exact millisecond value."
timeout_ms = 90000
requires = ["producer", "assigned_consumer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-timestamped-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-timestamped"

[steps.record]
topic = "testlab-kafkars-producer-explicit-timestamp"
partition = 0
sequence = 1
timestamp_millis = 1700000000123
key = { encoding = "utf8", data = "timestamp-key" }
value = { encoding = "utf8", data = "timestamp-value" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-timestamped" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-producer-explicit-timestamp"
partition = 0

[[steps]]
id = "receive-timestamped-record"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-timestamped"
expected_operation_id = "op-timestamped"
timeout_ms = 20000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-timestamped"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
