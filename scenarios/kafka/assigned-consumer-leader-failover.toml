schema_version = 168
id = "kafka.assigned-consumer-leader-failover"
title = "assigned consumer recovers across an observed partition leader election"
description = "Testlab independently stops the exact leader after a directly assigned consumer advances its cursor, then a distinct replacement serves the same public consumer an exact newly produced record while the original owner remains offline."
timeout_ms = 180000
requires = ["producer", "assigned_consumer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-producer-client"
kind = "create_client"
client_id = "producer-client"

[[steps]]
id = "await-producer-client-ready"
kind = "await_client_ready"
client_id = "producer-client"

[[steps]]
id = "create-consumer-client"
kind = "create_client"
client_id = "consumer-client"

[[steps]]
id = "await-consumer-client-ready"
kind = "await_client_ready"
client_id = "consumer-client"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "producer-client"
producer_id = "producer-1"

[[steps]]
id = "send-before-failover"
kind = "send"
producer_id = "producer-1"
operation_id = "assigned-before-failover"

[steps.record]
topic = "testlab-kafkars-assigned-leader-failover"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "before-leader-failover" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "assigned-before-failover" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "consumer-client"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assigned-leader-failover"
partition = 0

[[steps]]
id = "receive-before-failover"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "assigned-receive-before-failover"
expected_operation_id = "assigned-before-failover"
timeout_ms = 30000

[[steps]]
id = "stop-partition-leader"
kind = "stop_broker_role"
timeout_ms = 45000

[steps.target]
role = "partition_leader"
topic = "testlab-kafkars-assigned-leader-failover"
partition = 0

[[steps]]
id = "send-after-failover"
kind = "send"
producer_id = "producer-1"
operation_id = "assigned-after-failover"

[steps.record]
topic = "testlab-kafkars-assigned-leader-failover"
partition = 0
sequence = 2
value = { encoding = "utf8", data = "after-leader-failover" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "assigned-after-failover" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "receive-after-failover"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "assigned-receive-after-failover"
expected_operation_id = "assigned-after-failover"
timeout_ms = 45000

[[steps]]
id = "restore-partition-leader"
kind = "restore_broker_role"
timeout_ms = 45000

[steps.target]
role = "partition_leader"
topic = "testlab-kafkars-assigned-leader-failover"
partition = 0

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-consumer-client"
kind = "shutdown_client"
client_id = "consumer-client"

[[steps]]
id = "shutdown-producer-client"
kind = "shutdown_client"
client_id = "producer-client"

[[assertions]]
operation_id = "assigned-before-failover"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "assigned-after-failover"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
