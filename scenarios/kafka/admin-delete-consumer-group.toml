schema_version = 37
id = "kafka.admin-delete-consumer-group"
title = "packaged admin deletes an independently observed empty consumer group"
description = "After a classic group publicly commits offset 1 and closes, the packaged client's public admin describes the empty group, lists its checkpoint, and deletes it; independent broker-state queries confirm the same preconditions and final group absence."
timeout_ms = 150000
requires = ["producer", "consumer_groups", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-group-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-delete-group-marker"

[steps.record]
topic = "testlab-kafkars-admin-group-deleted"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "delete-group" }
value = { encoding = "utf8", data = "checkpoint-one" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-delete-group-marker" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-admin-deleted-group"
topic = "testlab-kafkars-admin-group-deleted"
protocol = "classic"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-delete-group"
expected_operation_id = "op-delete-group-marker"
timeout_ms = 30000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "describe-empty-group"
kind = "describe_consumer_group"
client_id = "client-1"
operation_id = "admin-delete-group-described"
group_id = "testlab-admin-deleted-group"
expected_member_count = 0
timeout_ms = 20000

[[steps]]
id = "list-offset-before-delete"
kind = "list_consumer_group_offsets"
client_id = "client-1"
operation_id = "admin-delete-group-offset"
group_id = "testlab-admin-deleted-group"
topic = "testlab-kafkars-admin-group-deleted"
partition = 0
require_stable = true
expected_offset = 1
timeout_ms = 20000

[[steps]]
id = "delete-group"
kind = "delete_consumer_group"
client_id = "client-1"
operation_id = "admin-delete-group-1"
group_id = "testlab-admin-deleted-group"
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-delete-group-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
