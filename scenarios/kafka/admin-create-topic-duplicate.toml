schema_version = 37
id = "kafka.admin-create-topic-duplicate"
title = "packaged admin rejects duplicate Kafka topic creation"
description = "The packaged client's public admin creates one topic, then an identical repeated creation reports the exact normalized topic-already-exists error while an immediate independent metadata query confirms the original partition set is unchanged."
timeout_ms = 90000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-original"
topic = "testlab-kafkars-admin-duplicate"
partitions = 2
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-topic-duplicate"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-create-duplicate"
topic = "testlab-kafkars-admin-duplicate"
partitions = 2
replication_factor = 1
validate_only = false
expected_error_code = "broker:broker_36"
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
