schema_version = 56
id = "kafka.admin-user-scram-credential-lifecycle"
title = "packaged admin manages exact named-user SCRAM credentials"
description = "The packaged client's public SCRAM operations upsert, describe, and delete SHA-256 and SHA-512 credentials while independent Kafka CLI queries confirm every terminal and final absence without recording password material."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "upsert-sha-256"
kind = "alter_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-256-upsert"
user = "testlab-kafkars-scram-user"
mechanism = "sha256"
iterations = 8192
timeout_ms = 20000

[[steps]]
id = "describe-sha-256"
kind = "describe_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-256-describe"
user = "testlab-kafkars-scram-user"
mechanism = "sha256"
expected_iterations = 8192
timeout_ms = 20000

[[steps]]
id = "delete-sha-256"
kind = "alter_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-256-delete"
user = "testlab-kafkars-scram-user"
mechanism = "sha256"
timeout_ms = 20000

[[steps]]
id = "describe-sha-256-absent"
kind = "describe_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-256-absent"
user = "testlab-kafkars-scram-user"
mechanism = "sha256"
timeout_ms = 20000

[[steps]]
id = "upsert-sha-512"
kind = "alter_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-512-upsert"
user = "testlab-kafkars-scram-user"
mechanism = "sha512"
iterations = 8192
timeout_ms = 20000

[[steps]]
id = "describe-sha-512"
kind = "describe_user_scram_credential"
client_id = "client-1"
operation_id = "admin-user-scram-sha-512-describe"
user = "testlab-kafkars-scram-user"
mechanism = "sha512"
expected_iterations = 8192
