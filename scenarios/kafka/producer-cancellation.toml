schema_version = 156
id = "kafka.producer-cancellation"
title = "both packaged producer operations preserve stage-aware cancellation truth"
description = "The packaged producer accepts exact records through immediate try_send and bounded waiting send, exposes two public cancellation outcomes on each retained observer, and reports authoritative terminals without strengthening a too-late result into a not-sent promise."
timeout_ms = 60000
requires = ["producer", "producer_waiting_send", "producer_cancellation", "producer_configuration", "lifecycle", "client_readiness"]

[[steps]]
id = "create-configured-client"
kind = "create_configured_client"
client_id = "client-1"

[steps.configuration]
delivery_timeout_ms = 10000
compression = "none"
max_retries = 2
retry_backoff_ms = 10

[steps.configuration.limits]
retained_bytes = 1048576
in_flight_records = 1
waiting_records = 1
waiting_bytes = 4096
batch_records = 1
batch_bytes = 262144
request_bytes = 524288
max_in_flight_requests_per_broker = 1
linger_ms = 0

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "cancel-send-twice"
kind = "cancel_producer_send"
producer_id = "producer-1"
operation_id = "cancel-send-1"
method = "try_send"
timeout_ms = 30000

[steps.record]
topic = "testlab-kafkars-producer-cancellation"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "cancel-key" }
value = { encoding = "utf8", data = "cancel-value" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "cancel-send-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "cancel-waiting-send-twice"
kind = "cancel_producer_send"
producer_id = "producer-1"
operation_id = "cancel-waiting-send-1"
method = "send"
timeout_ms = 30000

[steps.record]
topic = "testlab-kafkars-producer-cancellation"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "waiting-cancel-key" }
value = { encoding = "utf8", data = "waiting-cancel-value" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "cancel-waiting-send-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "cancel-send-1"
accepted = true
visibility = "zero_or_one"

[[assertions]]
operation_id = "cancel-waiting-send-1"
accepted = true
visibility = "zero_or_one"
