schema_version = 37
id = "kafka.producer-quota-progress"
title = "packaged producer makes bounded progress under an observed byte-rate quota"
description = "An independently observed user producer quota remains active for a bounded public send and flush, and the exact record remains broker-visible before the quota is removed."
timeout_ms = 150000
requires = ["producer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "limit-producer-rate"
kind = "alter_broker_policy"
state = "present"
timeout_ms = 20000

[steps.policy]
policy_kind = "quota"
direction = "producer"
bytes_per_second = 128
minimum_active_ms = 500

[[steps]]
id = "send-under-quota"
kind = "send"
producer_id = "producer-1"
operation_id = "op-quota-producer"

[steps.record]
topic = "testlab-kafkars-producer-quota"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "quota" }
value = { encoding = "utf8", data = "" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-quota-producer" } }]

[[steps]]
id = "flush-under-quota"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "remove-producer-limit"
kind = "alter_broker_policy"
state = "absent"
timeout_ms = 20000

[steps.policy]
policy_kind = "quota"
direction = "producer"
bytes_per_second = 128
minimum_active_ms = 500

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-quota-producer"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
