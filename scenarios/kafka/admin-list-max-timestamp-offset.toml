schema_version = 151
id = "kafka.admin-list-max-timestamp-offset"
title = "packaged admin selects the independently evidenced greatest timestamp"
description = "After two records reach one partition in descending timestamp order, the packaged client's public max-timestamp ListOffsets query selects offset 0 and returns its exact independently observed timestamp; neither earliest nor latest selection can satisfy the same evidence."
timeout_ms = 90000
requires = ["producer", "producer_batch", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-max-timestamp-markers"
kind = "send_batch"
producer_id = "producer-1"

[[steps.operations]]
operation_id = "op-max-timestamp-offset-0"

[steps.operations.record]
topic = "testlab-kafkars-admin-max-timestamp-offset"
partition = 0
sequence = 1
timestamp_millis = 1700000000223
key = { encoding = "utf8", data = "max-timestamp-offset-0" }
value = { encoding = "hex", data = "006d61782d74696d657374616d702d6f66667365742d30ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-max-timestamp-offset-0" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps.operations]]
operation_id = "op-max-timestamp-offset-1"

[steps.operations.record]
topic = "testlab-kafkars-admin-max-timestamp-offset"
partition = 0
sequence = 2
timestamp_millis = 1700000000123
key = { encoding = "utf8", data = "max-timestamp-offset-1" }
value = { encoding = "hex", data = "006d61782d74696d657374616d702d6f66667365742d31ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-max-timestamp-offset-1" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "list-max-timestamp-offset"
kind = "list_offsets"
client_id = "client-1"
operation_id = "admin-list-max-timestamp-offset-1"
topic = "testlab-kafkars-admin-max-timestamp-offset"
partition = 0
position = "max_timestamp"
expected_offset = 0
timeout_ms = 20000

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-max-timestamp-offset-0"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-max-timestamp-offset-1"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
