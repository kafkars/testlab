schema_version = 37
id = "kafka.admin-describe-consumer-group"
title = "packaged admin describes an independently observed live consumer group"
description = "After one classic member publicly consumes and commits an exact record, the packaged client's public group description reports one member while that consumer remains open and an immediate independent query confirms the same membership count."
timeout_ms = 120000
requires = ["producer", "consumer_groups", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-group-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-describe-group-marker"

[steps.record]
topic = "testlab-kafkars-admin-group-described"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "describe-group" }
value = { encoding = "utf8", data = "live-member" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-describe-group-marker" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-admin-described-group"
topic = "testlab-kafkars-admin-group-described"
protocol = "classic"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-describe-group"
expected_operation_id = "op-describe-group-marker"
timeout_ms = 30000

[[steps]]
id = "describe-live-group"
kind = "describe_consumer_group"
client_id = "client-1"
operation_id = "admin-describe-group-1"
group_id = "testlab-admin-described-group"
expected_member_count = 1
timeout_ms = 20000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-describe-group-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
