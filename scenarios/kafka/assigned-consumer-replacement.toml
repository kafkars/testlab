schema_version = 37
id = "kafka.assigned-consumer-replacement"
title = "direct assignment replacement excludes the removed partition"
description = "After replacing partition zero with partition one, a packaged direct consumer returns the exact partition-one record even while a later partition-zero record is broker-visible."
timeout_ms = 120000
requires = ["producer", "assigned_consumer", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-partition-zero"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assignment-replacement"
partition = 0

[[steps]]
id = "send-initial-zero"
kind = "send"
producer_id = "producer-1"
operation_id = "op-zero-initial"

[steps.record]
topic = "testlab-kafkars-assignment-replacement"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "partition-zero" }
value = { encoding = "utf8", data = "initial" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-zero-initial" } }]

[[steps]]
id = "receive-initial-zero"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-zero-initial"
expected_operation_id = "op-zero-initial"
timeout_ms = 20000

[[steps]]
id = "replace-with-partition-one"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-kafkars-assignment-replacement"
partition = 1

[[steps]]
id = "send-removed-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-zero-removed"

[steps.record]
topic = "testlab-kafkars-assignment-replacement"
partition = 0
sequence = 2
key = { encoding = "utf8", data = "partition-zero" }
value = { encoding = "utf8", data = "removed" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-zero-removed" } }]

[[steps]]
id = "send-current-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-one-current"

[steps.record]
topic = "testlab-kafkars-assignment-replacement"
partition = 1
sequence = 3
key = { encoding = "utf8", data = "partition-one" }
value = { encoding = "utf8", data = "current" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-one-current" } }]

[[steps]]
id = "receive-current-partition"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-one-current"
expected_operation_id = "op-one-current"
timeout_ms = 20000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-zero-initial"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-zero-removed"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-one-current"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
