schema_version = 37
id = "kafka.consumer-protocol-group-shutdown"
title = "KIP-848 repeated shutdown requests terminate and leave"
description = "After a KIP-848 member publicly receives and commits an exact record, two clone-shared shutdown requests preserve idempotence and terminate its public event stream; packaged Admin and an immediate independent broker query then both report zero live members."
timeout_ms = 150000
requires = ["producer", "consumer_protocol_groups", "group_consumer_shutdown", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-shutdown-marker"
kind = "send"
producer_id = "producer-1"
operation_id = "op-consumer-shutdown-marker"

[steps.record]
topic = "testlab-kafkars-consumer-shutdown"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "consumer-shutdown" }
value = { encoding = "utf8", data = "live-before-requests" }
headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-consumer-shutdown-marker" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-consumer-protocol-member"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-consumer-shutdown-group"
topic = "testlab-kafkars-consumer-shutdown"
protocol = "consumer"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-consumer-shutdown"
expected_operation_id = "op-consumer-shutdown-marker"
timeout_ms = 30000

[[steps]]
id = "request-twice-and-observe-shutdown"
kind = "shutdown_group_consumer"
operation_id = "shutdown-consumer-member"
consumer_id = "consumer-1"
request_count = 2
timeout_ms = 45000

[[steps]]
id = "describe-empty-group"
kind = "describe_consumer_group"
client_id = "client-1"
operation_id = "describe-consumer-after-shutdown"
group_id = "testlab-consumer-shutdown-group"
expected_member_count = 0
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-consumer-shutdown-marker"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
