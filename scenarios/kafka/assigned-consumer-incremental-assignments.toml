schema_version = 37
id = "kafka.assigned-consumer-incremental-assignments"
title = "incremental assignments preserve surviving direct-consumer cursors"
description = "The packaged client adds partition one without replaying partition zero, then removes partition zero while partition one remains usable."
timeout_ms = 180000
requires = ["producer", "assigned_consumer", "assigned_consumer_controls", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-partition-zero"
kind = "control_assigned_consumer"
operation_id = "control-replace-zero"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "replace"
partitions = [
  { topic = "testlab-kafkars-assigned-incremental", partition = 0, position = { kind = "beginning" } },
]

[[steps]]
id = "send-zero-first"
kind = "send"
producer_id = "producer-1"
operation_id = "op-zero-first"

[steps.record]
topic = "testlab-kafkars-assigned-incremental"
partition = 0
sequence = 1
value = { encoding = "utf8", data = "zero-first" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-zero-first" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps]]
id = "receive-zero-first"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-zero-first"
expected_operation_id = "op-zero-first"
timeout_ms = 30000

[[steps]]
id = "add-partition-one"
kind = "control_assigned_consumer"
operation_id = "control-add-one"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "add"
partitions = [
  { topic = "testlab-kafkars-assigned-incremental", partition = 1, position = { kind = "beginning" } },
]

[[steps]]
id = "send-zero-second"
kind = "send"
producer_id = "producer-1"
operation_id = "op-zero-second"

[steps.record]
topic = "testlab-kafkars-assigned-incremental"
partition = 0
sequence = 2
value = { encoding = "utf8", data = "zero-second" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-zero-second" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "receive-zero-second"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-zero-second"
expected_operation_id = "op-zero-second"
timeout_ms = 30000

[[steps]]
id = "remove-partition-zero"
kind = "control_assigned_consumer"
operation_id = "control-remove-zero"
consumer_id = "consumer-1"
timeout_ms = 30000

[steps.control]
kind = "remove"
partitions = [
  { topic = "testlab-kafkars-assigned-incremental", partition = 0 },
]

[[steps]]
id = "send-removed-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-zero-removed"

[steps.record]
topic = "testlab-kafkars-assigned-incremental"
partition = 0
sequence = 3
value = { encoding = "utf8", data = "zero-removed" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-zero-removed" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps]]
id = "send-surviving-partition"
kind = "send"
producer_id = "producer-1"
operation_id = "op-one-survives"

[steps.record]
topic = "testlab-kafkars-assigned-incremental"
partition = 1
sequence = 4
value = { encoding = "utf8", data = "one-survives" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-one-survives" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "4" } },
]

[[steps]]
id = "receive-surviving-partition"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-one-survives"
expected_operation_id = "op-one-survives"
timeout_ms = 30000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-zero-first"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-zero-second"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-zero-removed"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"

[[assertions]]
operation_id = "op-one-survives"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
