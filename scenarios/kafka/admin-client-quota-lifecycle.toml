schema_version = 130
id = "kafka.admin-client-quota-lifecycle"
title = "packaged admin preserves strict and non-strict client-quota descriptions"
description = "The packaged client's public quota operations set, describe with paired strict and non-strict filters, validate without mutation, and remove producer and consumer byte rates while independent Kafka CLI queries confirm every terminal and the final clean state."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "set-producer-quota"
kind = "alter_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-producer-set"
user = "testlab-kafkars-quota-user"
direction = "producer"
bytes_per_second = 65536
validate_only = false
timeout_ms = 20000

[[steps]]
id = "describe-producer-quota"
kind = "describe_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-producer-describe"
user = "testlab-kafkars-quota-user"
direction = "producer"
strict = true
expected_bytes_per_second = 65536
timeout_ms = 20000

[[steps]]
id = "describe-producer-quota-nonstrict"
kind = "describe_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-producer-describe-nonstrict"
user = "testlab-kafkars-quota-user"
direction = "producer"
strict = false
expected_bytes_per_second = 65536
timeout_ms = 20000

[[steps]]
id = "validate-producer-quota"
kind = "alter_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-producer-validate"
user = "testlab-kafkars-quota-user"
direction = "producer"
bytes_per_second = 32768
validate_only = true
expected_current_bytes_per_second = 65536
timeout_ms = 20000

[[steps]]
id = "remove-producer-quota"
kind = "alter_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-producer-remove"
user = "testlab-kafkars-quota-user"
direction = "producer"
validate_only = false
timeout_ms = 20000

[[steps]]
id = "set-consumer-quota"
kind = "alter_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-consumer-set"
user = "testlab-kafkars-quota-user"
direction = "consumer"
bytes_per_second = 131072
validate_only = false
timeout_ms = 20000

[[steps]]
id = "describe-consumer-quota"
kind = "describe_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-consumer-describe"
user = "testlab-kafkars-quota-user"
direction = "consumer"
expected_bytes_per_second = 131072
timeout_ms = 20000

[[steps]]
id = "remove-consumer-quota"
kind = "alter_client_quota"
client_id = "client-1"
operation_id = "admin-client-quota-consumer-remove"
user = "testlab-kafkars-quota-user"
direction = "consumer"
validate_only = false
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
