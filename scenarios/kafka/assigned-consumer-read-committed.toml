schema_version = 81
id = "kafka.assigned-consumer-read-committed"
title = "assigned consumer read committed hides an aborted record"
description = "A client configured through the packaged public assigned-consumer policy starts its direct assignment at the beginning after one aborted transaction and returns only the exact nontransactional sentinel while independent transaction evidence proves the aborted operation remains absent."
timeout_ms = 180000
requires = ["producer", "assigned_consumer", "assigned_consumer_configuration", "transactions", "lifecycle", "client_readiness"]

[[steps]]
id = "create-assigned-consumer-client"
kind = "create_assigned_consumer_client"
client_id = "client-1"

[steps.configuration]
read_isolation = "read_committed"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-transactional-producer"
kind = "create_transactional_producer"
client_id = "client-1"
producer_id = "transactional-producer-1"
transactional_id = "testlab-assigned-read-committed-owner"
transaction_timeout_ms = 30000
initialization_timeout_ms = 30000

[[steps]]
id = "abort-hidden-record"
kind = "execute_transaction"
producer_id = "transactional-producer-1"
transaction_id = "transaction-aborted"
disposition = "abort"
timeout_ms = 60000

[[steps.operations]]
operation_id = "op-aborted"
record = { topic = "testlab-assigned-read-committed", partition = 0, sequence = 1, value = { encoding = "utf8", data = "aborted" }, headers = [{ name = "testlab-operation-id", value = { encoding = "utf8", data = "op-aborted" } }, { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } }] }

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-visible-sentinel"
kind = "send"
producer_id = "producer-1"
operation_id = "op-visible"

[steps.record]
topic = "testlab-assigned-read-committed"
partition = 0
sequence = 2
value = { encoding = "utf8", data = "visible" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-visible" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps]]
id = "create-consumer"
kind = "create_assigned_consumer"
client_id = "client-1"
consumer_id = "consumer-1"

[[steps]]
id = "assign-consumer"
kind = "assign_beginning"
consumer_id = "consumer-1"
topic = "testlab-assigned-read-committed"
partition = 0

[[steps]]
id = "receive-visible-sentinel"
kind = "receive"
consumer_id = "consumer-1"
receive_id = "receive-visible"
expected_operation_id = "op-visible"
timeout_ms = 30000

[[steps]]
id = "close-consumer"
kind = "close_assigned_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "close-transactional-producer"
kind = "close_transactional_producer"
producer_id = "transactional-producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-aborted"
accepted = true
terminal = "transaction_staged"
visibility = "absent"

[[assertions]]
operation_id = "op-visible"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
