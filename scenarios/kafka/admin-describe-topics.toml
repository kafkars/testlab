schema_version = 156
id = "kafka.admin-describe-topics"
title = "packaged admin describes caller-ordered topics with authorization metadata"
description = "One public plural name-keyed topic description requests and retains authorization bitfields while preserving caller order, detailed partitions, and an exact missing-topic error against immediate independent metadata."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "describe-topics"
kind = "describe_topics"
client_id = "client-1"
operation_id = "admin-describe-topics"
include_authorized_operations = true
topics = [
  { topic = "testlab-kafkars-admin-describe-topics-zulu", expected_partitions = [0, 1] },
  { topic = "testlab-kafkars-admin-describe-topics-missing", expected_error_code = "broker:broker_3" },
  { topic = "testlab-kafkars-admin-describe-topics-alpha", expected_partitions = [0] },
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
