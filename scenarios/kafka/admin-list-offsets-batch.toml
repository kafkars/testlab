schema_version = 42
id = "kafka.admin-list-offsets-batch"
title = "packaged admin lists a caller-ordered offset batch"
description = "One public ListOffsets call preserves a deliberately non-partition-sorted query order while reporting exact earliest and latest offsets independently confirmed from broker watermarks."
timeout_ms = 100000
requires = ["producer", "producer_batch", "admin", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-partition-markers"
kind = "send_batch"
producer_id = "producer-1"

[[steps.operations]]
operation_id = "op-offset-batch-p0"

[steps.operations.record]
topic = "testlab-kafkars-admin-offset-batch"
partition = 0
sequence = 1
key = { encoding = "utf8", data = "offset-batch-p0" }
value = { encoding = "utf8", data = "p0-record" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-offset-batch-p0" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
]

[[steps.operations]]
operation_id = "op-offset-batch-p1-zero"

[steps.operations.record]
topic = "testlab-kafkars-admin-offset-batch"
partition = 1
sequence = 2
key = { encoding = "utf8", data = "offset-batch-p1-zero" }
value = { encoding = "utf8", data = "p1-record-zero" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-offset-batch-p1-zero" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "2" } },
]

[[steps.operations]]
operation_id = "op-offset-batch-p1-one"

[steps.operations.record]
topic = "testlab-kafkars-admin-offset-batch"
partition = 1
sequence = 3
key = { encoding = "utf8", data = "offset-batch-p1-one" }
value = { encoding = "utf8", data = "p1-record-one" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-offset-batch-p1-one" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "3" } },
]

[[steps.operations]]
operation_id = "op-offset-batch-p2"

[steps.operations.record]
topic = "testlab-kafkars-admin-offset-batch"
partition = 2
sequence = 4
key = { encoding = "utf8", data = "offset-batch-p2" }
value = { encoding = "utf8", data = "p2-record" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-offset-batch-p2" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "4" } },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "list-offset-batch"
kind = "list_offsets_batch"
client_id = "client-1"
operation_id = "admin-list-offset-batch"
timeout_ms = 20000

[[steps.queries]]
topic = "testlab-kafkars-admin-offset-batch"
partition = 2
position = "latest"
expected_offset = 1

[[steps.queries]]
topic = "testlab-kafkars-admin-offset-batch"
partition = 0
position = "earliest"
expected_offset = 0

[[steps.queries]]
topic = "testlab-kafkars-admin-offset-batch"
partition = 1
position = "latest"
expected_offset = 2

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
