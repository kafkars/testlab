schema_version = 8
id = "kafka.consumer-protocol-group-round-trip"
title = "packaged KIP-848 group consumer receives and commits exact bytes"
description = "The packaged client joins with the consumer group protocol, returns the exact public record, commits its checkpoint, and exposes a positive KIP-848 member epoch."
timeout_ms = 120000
requires = ["producer", "consumer_protocol_groups", "lifecycle", "client_readiness"]

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-producer"
kind = "create_producer"
client_id = "client-1"
producer_id = "producer-1"

[[steps]]
id = "send-record"
kind = "send"
producer_id = "producer-1"
operation_id = "op-produced"

[steps.record]
topic = "testlab-kafkars-kip848-group"
partition = 0
sequence = 1
key = { encoding = "hex", data = "006b6970383438ff" }
value = { encoding = "hex", data = "00636f6d6d6974ff" }
headers = [
  { name = "testlab-operation-id", value = { encoding = "utf8", data = "op-produced" } },
  { name = "testlab-sequence", value = { encoding = "utf8", data = "1" } },
  { name = "binary", value = { encoding = "hex", data = "00ff" } },
  { name = "nullable" },
]

[[steps]]
id = "flush-producer"
kind = "flush"
producer_id = "producer-1"

[[steps]]
id = "close-producer"
kind = "close_producer"
producer_id = "producer-1"

[[steps]]
id = "create-group-consumer"
kind = "create_group_consumer"
client_id = "client-1"
consumer_id = "consumer-1"
group_id = "testlab-kip848-group"
topic = "testlab-kafkars-kip848-group"
protocol = "consumer"

[[steps]]
id = "receive-and-commit"
kind = "group_receive"
consumer_id = "consumer-1"
receive_id = "receive-1"
expected_operation_id = "op-produced"
timeout_ms = 30000

[[steps]]
id = "close-group-consumer"
kind = "close_group_consumer"
consumer_id = "consumer-1"

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"

[[assertions]]
operation_id = "op-produced"
accepted = true
terminal = "acknowledged"
visibility = "exactly_once"
