schema_version = 140
id = "kafka.admin-list-topics-multiple"
title = "packaged admin lists multiple detailed topics with authorization metadata"
description = "The packaged client's public admin creates three topics and then lists all three from one expectation-free command; every public result retains authorization and partition detail in byte order while independent metadata confirms each required topology."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-zulu-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-zulu"
topic = "testlab-kafkars-admin-multi-topic-zulu"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-alpha-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-alpha"
topic = "testlab-kafkars-admin-multi-topic-alpha"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-middle-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-middle"
topic = "testlab-kafkars-admin-multi-topic-middle"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "list-created-topics"
kind = "list_topics"
client_id = "client-1"
operation_id = "admin-multi-topic-list"
include_internal = false
include_authorized_operations = true
expected_topics = [
  { topic = "testlab-kafkars-admin-multi-topic-zulu", internal = false, included = true },
  { topic = "testlab-kafkars-admin-multi-topic-alpha", internal = false, included = true },
  { topic = "testlab-kafkars-admin-multi-topic-middle", internal = false, included = true },
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
