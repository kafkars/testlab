schema_version = 37
id = "kafka.admin-list-topics-multiple"
title = "packaged admin lists multiple independently observed Kafka topics"
description = "The packaged client's public admin creates three topics and then lists all three from one expectation-free command; the public result must be byte-sorted and independent metadata observations confirm every required topic."
timeout_ms = 120000
requires = ["admin", "lifecycle", "client_readiness"]
assertions = []

[[steps]]
id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "create-zulu-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-zulu"
topic = "testlab-kafkars-admin-multi-topic-zulu"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-alpha-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-alpha"
topic = "testlab-kafkars-admin-multi-topic-alpha"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "create-middle-topic"
kind = "create_topic"
client_id = "client-1"
operation_id = "admin-multi-topic-create-middle"
topic = "testlab-kafkars-admin-multi-topic-middle"
partitions = 1
replication_factor = 1
validate_only = false
timeout_ms = 20000

[[steps]]
id = "list-created-topics"
kind = "list_topics"
client_id = "client-1"
operation_id = "admin-multi-topic-list"
include_internal = false
required_topics = [
  "testlab-kafkars-admin-multi-topic-zulu",
  "testlab-kafkars-admin-multi-topic-alpha",
  "testlab-kafkars-admin-multi-topic-middle",
]
timeout_ms = 20000

[[steps]]
id = "shutdown-client"
kind = "shutdown_client"
client_id = "client-1"
