id = "create-client"
kind = "create_client"
client_id = "client-1"

[[steps]]
id = "await-client-ready"
kind = "await_client_ready"
client_id = "client-1"

[[steps]]
id = "exercise-streams-group-admin-lifecycle"
kind = "exercise_streams_group_admin_lifecycle"
client_id = "client-1"
operation_id = "admin-streams-group-lifecycle"
primary_group_id = "testlab-streams-primary"
secondary_group_id = "testlab-streams-secondary"
input_topic = "streams-plaintext-input"
output_topic = "streams-wordcount-output"
expected_initial_offset = 1
altered_offset = 0
timeout_ms = 60000

[[steps]]
id = "shutdown-client"
